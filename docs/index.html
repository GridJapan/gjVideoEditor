<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GJ VIDEO EDITOR</title>
<link rel="canonical" href="https://gridjapan.github.io/gjVideoEditor/jp/">
<link rel="alternate" hreflang="ja" href="https://gridjapan.github.io/gjVideoEditor/jp/">
<link rel="alternate" hreflang="en" href="https://gridjapan.github.io/gjVideoEditor/en/">
<link rel="alternate" hreflang="x-default" href="https://gridjapan.github.io/gjVideoEditor/jp/">
<script>
(function () {
  var map = { ja: 'jp', en: 'en' };
  var dir = 'jp';                       // 既定は日本語
  try {
    var langs = (navigator.languages && navigator.languages.length)
      ? navigator.languages : [navigator.language || ''];
    for (var i = 0; i < langs.length; i++) {
      var code = (langs[i] || '').toLowerCase().split('-')[0];
      if (map[code]) { dir = map[code]; break; }
    }
  } catch (e) {}
  location.replace(dir + '/');
})();
</script>
<meta http-equiv="refresh" content="0; url=./jp/">
<style>
body{font-family:system-ui,-apple-system,"Hiragino Sans",sans-serif;background:#fff;color:#334155;
  text-align:center;padding:72px 20px;line-height:2}
a{color:#2563eb;text-decoration:none;margin:0 12px;font-weight:600}
a:hover{text-decoration:underline}
</style>
</head>
<body>
<p>Redirecting… / 言語を選択:</p>
<p>

</p>
</body>
