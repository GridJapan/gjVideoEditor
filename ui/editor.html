  const setFb=()=>{ fb.className='tgl'+(c.flip?' on':''); fb.textContent=c.flip?'⇄ 左右反転 ON':'⇄ 左右反転 OFF'; };
  fb.addEventListener('click',()=>{ if(c.flip) delete c.flip; else c.flip=true; setFb(); pushHistory(); live(); });
  setFb(); rFl.appendChild(fb);
  [['brightness','明るさ'],['contrast','コントラスト'],['saturation','彩度']].forEach(([k,lab])=>{
    const r=mkRow(lab);
    const val=document.createElement('span'); val.style.cssText='width:40px;text-align:right;';
    const cur=()=>((c.adjust||{})[k]==null?1:c.adjust[k]);
    const setLbl=()=>val.textContent=Math.round(cur()*100)+'%';
    const s=document.createElement('input'); s.type='range'; s.min='0'; s.max='2'; s.step='0.05'; s.value=cur();
    s.addEventListener('input',()=>{ const v=parseFloat(s.value); const col=c.adjust||{};
      if(Math.abs(v-1)<0.005) delete col[k]; else col[k]=v;
      if(Object.keys(col).length) c.adjust=col; else delete c.adjust;
      setLbl(); live(); });
    s.addEventListener('change',()=>pushHistory());
    setLbl(); r.append(s,val);
  });
}
function renderInspector(){
  const box=$('inspector');
  cropNumInputs=null;
  if(!selected||!proj.tracks[selected.ti]||!proj.tracks[selected.ti].clips[selected.ci]){
    box.className='inspector empty'; box.textContent='レーンのブロックをクリックすると、ここで編集できます'; return;
  }
  const tr=proj.tracks[selected.ti], c=tr.clips[selected.ci];
  box.className='inspector'; box.innerHTML='';
  const head=document.createElement('div'); head.className='insp-head';
  if(tr.type==='caption'){
    renderCaptionInspector(box,head,tr,c);
  } else if(tr.type==='image'){
    const ttl=document.createElement('span'); ttl.className='insp-title'; ttl.textContent='🖼 画像: '+(c.src||'');
    const tm=document.createElement('span'); tm.className='insp-time'; tm.textContent=fmt(c.start)+' → '+fmt(c.end);
    head.append(ttl,tm); box.appendChild(head);
    const note=document.createElement('div'); note.className='insp-note';
    note.textContent='プレビュー上で画像をドラッグ＝移動、右下角ドラッグ＝拡大縮小。タイムラインの両端＝表示する時間。';
    box.appendChild(note);
    const grid=document.createElement('div'); grid.className='insp-grid'; box.appendChild(grid);
    const mkRow=(label)=>{ const r=document.createElement('div'); r.className='frow2';
      const l=document.createElement('span'); l.className='flabel'; l.textContent=label; r.appendChild(l); grid.appendChild(r); return r; };
    // 角丸（100%=正円）
    const rRd=mkRow('角丸');
    const rdl=document.createElement('span'); rdl.style.cssText='width:34px;text-align:right;';
    const setRdLbl=()=>rdl.textContent=(c.radius>=0.999?'円':Math.round((c.radius||0)*100)+'%');
    const rd=document.createElement('input'); rd.type='range'; rd.min='0'; rd.max='1'; rd.step='0.05'; rd.value=(c.radius||0);
    rd.addEventListener('input',()=>{ c.radius=parseFloat(rd.value); if(!c.radius) delete c.radius; setRdLbl(); updateImageVis(); });
    rd.addEventListener('change',()=>pushHistory());
    setRdLbl(); rRd.append(rd,rdl);
    // サイズ・回転は一般的な編集ソフトと同じ「数値で指定する」形にする
    // （旧UIの「なし/寄り/引き」は独自すぎて何が起きるか分からなかった。2026-07-21指摘）
    const numIn=(get,set,{min,max,step,unit,after})=>{
      const n=document.createElement('input'); n.type='number';
      n.min=min; n.max=max; n.step=step; n.className='numin'; n.value=get();
      n.addEventListener('input',()=>{ const val=parseFloat(n.value);
        if(!isNaN(val)){ set(Math.max(min,Math.min(max,val))); (after||updateImageVis)(); } });
      n.addEventListener('change',()=>pushHistory());
      const w=document.createElement('span'); w.append(n); if(unit) w.append(unit); return w;
    };
    // サイズ: 内部は正規化幅(w)。画面上は「画面幅に対する%」で見せる
    const rSz=mkRow('サイズ');
    rSz.appendChild(numIn(()=>Math.round((c.w==null?0.3:c.w)*100),
      v=>{ c.w=v/100; }, {min:1,max:400,step:1,unit:'%'}));
    // 回転
    const rRo=mkRow('回転');
    rRo.appendChild(numIn(()=>c.rotate||0, v=>{ c.rotate=v; if(!v) delete c.rotate; },
      {min:-180,max:180,step:0.5,unit:'°'}));
    // ズーム（クリップの長さをかけてサイズが変化する。キーフレームの代わり）
    const rZm=mkRow('ズーム');
    const zEnd=()=>{ const z=(c.motion||{}).zoom; return z?Math.round(z*100):100; };
    rZm.append('終了', numIn(zEnd, v=>{
      if(Math.abs(v-100)<0.5) delete c.motion; else c.motion={zoom:v/100};
    }, {min:80,max:150,step:1,unit:'%'}));
    const zNote=document.createElement('span'); zNote.style.cssText='font-size:11px;color:#6b7280;';
    zNote.textContent = (c.motion||{}).zoom ? '（100%から変化）' : '（100%＝動かない）';
    rZm.appendChild(zNote);
    // パン（切り出し窓が動く方向。ズーム未指定なら書き出しは固定1.1で全域を横断）
    const rPn=mkRow('パン');
    const pnSel=document.createElement('select');
    [['','なし'],['left','← 左へ'],['right','→ 右へ'],['up','↑ 上へ'],['down','↓ 下へ']].forEach(([v,l])=>{
      const o=document.createElement('option'); o.value=v; o.textContent=l; pnSel.appendChild(o); });
    pnSel.value=(c.motion||{}).pan||'';
    pnSel.addEventListener('change',()=>{ const m=c.motion||{};
      if(pnSel.value) m.pan=pnSel.value; else delete m.pan;
      if(Object.keys(m).length) c.motion=m; else delete c.motion;
      pushHistory(); updateImageVis(); });
    rPn.appendChild(pnSel);
    // フェード（書き出しはアルファで背景に沈む）
    const rFd=mkRow('フェード');
    rFd.append('IN', numIn(()=>c.fadeIn||0, v=>{ c.fadeIn=v; if(!v) delete c.fadeIn; updateImageVis(); },
      {min:0,max:5,step:0.1,unit:'秒'}));
    rFd.append('OUT', numIn(()=>c.fadeOut||0, v=>{ c.fadeOut=v; if(!v) delete c.fadeOut; updateImageVis(); },
      {min:0,max:5,step:0.1,unit:'秒'}));
    // 不透明度
    const rOp2=mkRow('不透明度');
    const opl=document.createElement('span'); opl.style.cssText='width:34px;text-align:right;';
    const setOp2=()=>opl.textContent=Math.round((c.opacity==null?1:c.opacity)*100)+'%';
    const op2=document.createElement('input'); op2.type='range'; op2.min='0'; op2.max='1'; op2.step='0.05'; op2.value=(c.opacity==null?1:c.opacity);
    op2.addEventListener('input',()=>{ c.opacity=parseFloat(op2.value); if(c.opacity>=1) delete c.opacity; setOp2(); updateImageVis(); });
    op2.addEventListener('change',()=>pushHistory());
    setOp2(); rOp2.append(op2,opl);
    // 反転・色調整（書き出しはPIL前処理。プレビューはCSS filterで同じ意味）
    addColorRows(mkRow,c,updateImageVis);
    const del=document.createElement('button'); del.className='insp-del'; del.textContent='この画像を削除';
    del.addEventListener('click',()=>{ tr.clips.splice(selected.ci,1); selected=null; pushHistory(); build(); });
    box.appendChild(del);
  } else if(tr.type==='mask'){
    const ttl=document.createElement('span'); ttl.className='insp-title'; ttl.textContent='🟫 マスク';
    const tm=document.createElement('span'); tm.className='insp-time'; tm.textContent=fmt(c.start)+' → '+fmt(c.end);
    head.append(ttl,tm); box.appendChild(head);
    const grid=document.createElement('div'); grid.className='insp-grid'; box.appendChild(grid);
    const mkRow=(label)=>{ const r=document.createElement('div'); r.className='frow2';
      const l=document.createElement('span'); l.className='flabel'; l.textContent=label; r.appendChild(l); grid.appendChild(r); return r; };
    const seg=(items,cur,set)=>{ const s=document.createElement('div'); s.className='iconrow';
      items.forEach(([v,lab])=>{ const b=document.createElement('button'); b.className='iconbtn'+(cur===v?' on':''); b.textContent=lab; b.style.width='auto'; b.style.padding='0 8px';
        b.addEventListener('click',()=>{ set(v); pushHistory(); build(); }); s.appendChild(b); }); return s; };
    // モード: 隠す / ここだけ表示
    const rM=mkRow('モード');
    rM.appendChild(seg([['hide','範囲を隠す'],['show','ここだけ表示']], c.mode||'hide', v=>c.mode=v));
    // 種類（hide時のみ）
    if((c.mode||'hide')==='hide'){
      const rS=mkRow('種類');
      rS.appendChild(seg([['mosaic','モザイク'],['blur','ぼかし'],['solid','黒塗り']], c.style||'mosaic', v=>c.style=v));
    }
    // 強さ（黒塗り以外）
    if((c.style||'mosaic')!=='solid' || (c.mode==='show')){
      const rSt=mkRow('強さ');
      const sr=document.createElement('input'); sr.type='range'; sr.min='4'; sr.max='40'; sr.step='1'; sr.value=c.strength||12;
      const sl=document.createElement('span'); sl.style.cssText='width:28px;text-align:right;'; sl.textContent=(c.strength||12);
      sr.addEventListener('input',()=>{ c.strength=parseInt(sr.value,10); sl.textContent=c.strength; });
      sr.addEventListener('change',()=>pushHistory());
      rSt.append(sr,sl);
    }
    const note=document.createElement('div'); note.className='insp-note'; note.style.marginTop='6px';
    note.textContent='プレビュー上でドラッグ＝移動、右下角＝リサイズ。タイムラインの両端＝適用時間。書き出しに反映されます。';
    box.appendChild(note);
    const del=document.createElement('button'); del.className='insp-del'; del.textContent='このマスクを削除';
    del.addEventListener('click',()=>{ tr.clips.splice(selected.ci,1); selected=null; pushHistory(); build(); });
    box.appendChild(del);
  } else if(tr.type==='audio'){
    const isFV=!!c.fromVideo;
    const ttl=document.createElement('span'); ttl.className='insp-title'; ttl.textContent=(isFV?'🔊 元音声（分離中）: ':'🎵 音声: ')+(c.src||'');
    const tm=document.createElement('span'); tm.className='insp-time'; tm.textContent=fmt(c.start)+' → '+fmt(c.end)+'（in '+fmt(c.in||0)+'）';
    head.append(ttl,tm); box.appendChild(head);
    const gwrap=document.createElement('div'); gwrap.className='insp-note';
    const gl=document.createElement('div'); gl.textContent='音量 '+Math.round((c.gain==null?1:c.gain)*100)+'%';
    const gr=document.createElement('input'); gr.type='range'; gr.min='0'; gr.max='2'; gr.step='0.05'; gr.value=(c.gain==null?1:c.gain);
    gr.style.accentColor='var(--accent)';
    gr.addEventListener('input',e=>{ c.gain=parseFloat(e.target.value); gl.textContent='音量 '+Math.round(c.gain*100)+'%'; });
    gr.addEventListener('change',()=>pushHistory());
    gwrap.append(gl,gr);
    const note=document.createElement('div'); note.className='insp-note';
    note.textContent=isFV
      ? '映像から分離した音声です。独立して移動・トリムできます。「映像に再リンク」で元に戻せます。'
      : '左端ドラッグ＝頭出し（in）、右端＝末尾、本体ドラッグ＝配置。再生するとプレビューでも鳴ります（音量＝gain）。';
    box.append(gwrap,note);
    if(!isFV){
      // ダッキング: ナレーションの間だけ自動で沈む（BGM用。書き出しで反映）
      const dwrap=document.createElement('div'); dwrap.className='insp-note';
      const db=document.createElement('button'); db.className='tgl'+(c.duck?' on':'');
      db.textContent=c.duck?'🎚 ダッキング ON':'🎚 ダッキング OFF';
      db.title='ナレーション（idかlabelに narr/ナレ を含むトラック）が鳴っている間だけ、自動で音量を下げます';
      db.addEventListener('click',()=>{ if(c.duck) delete c.duck; else c.duck=true; pushHistory(); renderInspector(); });
      dwrap.appendChild(db);
      if(c.duck){
        const dl=document.createElement('span'); dl.style.cssText='margin-left:8px;font-size:11px;color:#8a90a0;';
        dl.textContent='ナレーション中は25%へ（書き出し時に反映）';
        dwrap.appendChild(dl);
      }
      box.appendChild(dwrap);
      // ループ: BGMが動画より短いとき、素材の終端で先頭から繰り返す
      const lwrap=document.createElement('div'); lwrap.className='insp-note';
      const lb=document.createElement('button'); lb.className='tgl'+(c.loop?' on':'');
      lb.textContent=c.loop?'🔁 ループ ON':'🔁 ループ OFF';
      lb.title='素材の終わりまで来たら先頭から繰り返します（BGMが動画より短いとき用）。ONの間はクリップを素材より長く伸ばせます';
      lb.addEventListener('click',()=>{ if(c.loop) delete c.loop; else c.loop=true; pushHistory(); renderInspector(); });
      lwrap.appendChild(lb);
      if(c.loop){
        const ls=document.createElement('span'); ls.style.cssText='margin-left:8px;font-size:11px;color:#8a90a0;';
        ls.textContent='素材の終端で先頭へ戻る。クリップを素材より長く伸ばせます';
        lwrap.appendChild(ls);
      }
      box.appendChild(lwrap);
    }
    if(isFV){
      const rb=document.createElement('button'); rb.style.marginTop='8px'; rb.textContent='🔗 映像に再リンク';
      rb.addEventListener('click',relinkAudio); box.appendChild(rb);
    } else {
      const del=document.createElement('button'); del.className='insp-del'; del.textContent='この音声を削除';
      del.addEventListener('click',()=>{ tr.clips.splice(selected.ci,1); selected=null; pushHistory(); build(); });
      box.appendChild(del);
    }
  } else {
    const ttl=document.createElement('span'); ttl.className='insp-title'; ttl.textContent='🎬 映像: '+(c.src||'');
    const tm=document.createElement('span'); tm.className='insp-time'; tm.textContent=fmt(c.start)+' → '+fmt(c.end)+'（in '+fmt(c.in||0)+'）';
    head.append(ttl,tm); box.appendChild(head);
    const grid=document.createElement('div'); grid.className='insp-grid'; box.appendChild(grid);
    const mkRow=(label)=>{ const r=document.createElement('div'); r.className='frow2';
      const l=document.createElement('span'); l.className='flabel'; l.textContent=label; r.appendChild(l); grid.appendChild(r); return r; };
    const numFor=(get,set,{min,max,step,unit,live})=>{
      const n=document.createElement('input'); n.type='number'; n.min=min; n.max=max; n.step=step; n.className='numin'; n.value=get();
      n.addEventListener('input',()=>{ const v=parseFloat(n.value); if(!isNaN(v)){ set(Math.max(min,Math.min(max,v))); (live?updateCap:0); syncVideoToTime(); build2(); } });
      n.addEventListener('change',()=>pushHistory());
      const wrap=document.createElement('span'); wrap.append(n); if(unit) wrap.append(unit); return wrap;
    };
    // 軽量再描画: タイムラインのフェード山型だけを描き直す。
    // build() を呼ぶと renderInspector() が走って入力欄ごと作り直され、
    // 1文字打つたびにフォーカスが飛んで「0.5」が入力できなくなる
    const build2=()=>{ if(selected) renderFades(selected.ti,selected.ci); };
    // 透明度
    const rOp=mkRow('透明度');
    const opv=document.createElement('span'); opv.style.cssText='width:34px;text-align:right;';
    const setOpLbl=()=>opv.textContent=Math.round((c.opacity==null?1:c.opacity)*100)+'%';
    const op=document.createElement('input'); op.type='range'; op.min='0'; op.max='1'; op.step='0.05'; op.value=(c.opacity==null?1:c.opacity);
    op.addEventListener('input',()=>{ c.opacity=parseFloat(op.value); setOpLbl(); syncVideoToTime(); });
    op.addEventListener('change',()=>pushHistory());
    setOpLbl(); rOp.append(op,opv);
    // 音量（書き出しの volume=gain と同一倍率。100%超は増幅）
    const rGa=mkRow('音量');
    const gav=document.createElement('span'); gav.style.cssText='width:34px;text-align:right;';
    const setGaLbl=()=>gav.textContent=Math.round((c.gain==null?1:c.gain)*100)+'%';
    const ga=document.createElement('input'); ga.type='range'; ga.min='0'; ga.max='2'; ga.step='0.05'; ga.value=(c.gain==null?1:c.gain);
    ga.addEventListener('input',()=>{ c.gain=parseFloat(ga.value); setGaLbl(); syncVideoToTime(); });
    ga.addEventListener('change',()=>pushHistory());
    setGaLbl(); rGa.append(ga,gav);
    // 拡大縮小
    const rSc=mkRow('拡大縮小');
    rSc.appendChild(numFor(()=>c.scale==null?1:c.scale, v=>{c.scale=v;}, {min:0.1,max:4,step:0.05,unit:'×'}));
    // 再生速度（音の高さは保ったまま速くなる。end はそのまま＝ソースを speed 倍消費する）
    const rSp=mkRow('速度');
    rSp.appendChild(numFor(()=>c.speed==null?1:c.speed, v=>{ c.speed=v; if(Math.abs(v-1)<1e-3) delete c.speed; },
      {min:0.25,max:4,step:0.25,unit:'×'}));
    const spNote=document.createElement('span'); spNote.style.cssText='font-size:11px;color:#6b7280;';
    spNote.textContent='（2×＝早送り。表示時間は変わらず、素材を2倍消費）';
    rSp.appendChild(spNote);
    // 角丸（100%=正円。ワイプを丸くする用途）
    const rRd=mkRow('角丸');
    const rdv=document.createElement('span'); rdv.style.cssText='width:34px;text-align:right;';
    const setRdLbl=()=>rdv.textContent=(c.radius>=0.999?'円':Math.round((c.radius||0)*100)+'%');
    const rd=document.createElement('input'); rd.type='range'; rd.min='0'; rd.max='1'; rd.step='0.05'; rd.value=(c.radius||0);
    rd.addEventListener('input',()=>{ c.radius=parseFloat(rd.value); if(!c.radius) delete c.radius; setRdLbl(); syncVideoToTime(); });
    rd.addEventListener('change',()=>pushHistory());
    setRdLbl(); rRd.append(rd,rdv);
    // 位置（ワイプ/PiP）: x/y を入れると左上基準で配置。未指定なら全画面（従来動作）
    const rPos=mkRow('位置');
    const posOn=document.createElement('button'); posOn.className='tgl'+((c.x!=null&&c.y!=null)?' on':'');
    posOn.textContent=(c.x!=null&&c.y!=null)?'ワイプ':'全画面';
    posOn.title='ワイプ(小窓)にすると、プレビュー上でドラッグして動かせます';
    posOn.addEventListener('click',()=>{
      if(c.x!=null&&c.y!=null){ delete c.x; delete c.y; }        // 全画面へ戻す
      else { c.x=0.665; c.y=0.02; if(c.scale==null||c.scale===1) c.scale=0.3; }  // 右上のワイプに
      pushHistory(); build(); syncVideoToTime();
    });
    rPos.appendChild(posOn);
    if(c.x!=null&&c.y!=null){
      rPos.append('X');
      rPos.appendChild(numFor(()=>Math.round((c.x||0)*100), v=>{c.x=Math.max(0,Math.min(1,v/100));}, {min:0,max:100,step:1,unit:'%'}));
      rPos.append('Y');
      rPos.appendChild(numFor(()=>Math.round((c.y||0)*100), v=>{c.y=Math.max(0,Math.min(1,v/100));}, {min:0,max:100,step:1,unit:'%'}));
    }
    // トリミング（上下左右の切り取り%）。プレビュー枠と双方向連動
    const rCr=mkRow('トリミング');
    const cr=c.crop||[0,0,0,0];
    cropNumInputs=[null,null,null,null];
    ['左','上','右','下'].forEach((lab,k)=>{
      const n=document.createElement('input'); n.type='number'; n.min='0'; n.max='45'; n.step='1'; n.className='numin'; n.style.width='38px';
      n.title=lab+'の切り取り%'; n.value=Math.round((cr[k]||0)*100);
      n.addEventListener('input',()=>{ const arr=(c.crop||[0,0,0,0]).slice(); arr[k]=Math.max(0,Math.min(0.45,(parseFloat(n.value)||0)/100)); c.crop=arr; syncVideoToTime(); positionCropOverlay(); });
      n.addEventListener('change',()=>pushHistory());
      cropNumInputs[k]=n;
      rCr.append(lab,n);
    });
    // フェード
    const rFd=mkRow('フェード');
    const mkFade=(key,lab)=>{ const n=document.createElement('input'); n.type='number'; n.min='0'; n.max='10'; n.step='0.1'; n.className='numin'; n.title=lab;
      n.value=c[key]||0; n.addEventListener('input',()=>{ c[key]=Math.max(0,Math.min(10,parseFloat(n.value)||0)); syncVideoToTime(); build2(); });
      n.addEventListener('change',()=>pushHistory()); return n; };
    rFd.append('IN',mkFade('fadeIn','フェードイン秒'),'s　OUT',mkFade('fadeOut','フェードアウト秒'),'s');
    // 反転・色調整（書き出しは hflip / colorchannelmixer+eq。プレビューはCSS filterで同じ意味）
    addColorRows(mkRow,c,syncVideoToTime);
    const note=document.createElement('div'); note.className='insp-note'; note.style.marginTop='6px';
    note.textContent='左端ドラッグ＝冒頭トリム(in)、右端＝末尾。透明度/拡大縮小/トリミング/フェードは書き出しに反映。フェードはタイムラインに山型で表示。';
    box.appendChild(note);
    const linked=(c.audioLinked!==false);
    const ab=document.createElement('button'); ab.style.marginTop='8px';
    ab.textContent = linked ? '🔗 音声を分離' : '🔗 音声を映像に再リンク';
    ab.addEventListener('click', linked ? detachAudio : relinkAudio);
    box.appendChild(ab);
    const del=document.createElement('button'); del.className='insp-del'; del.textContent='この映像を削除';
    del.addEventListener('click',()=>{ tr.clips.splice(selected.ci,1); selected=null; pushHistory(); build(); });
    box.appendChild(del);
  }
}
function refreshClipLabel(ti,ci){
  const el=clipElFor(ti,ci); if(!el) return;       // index ではなく data-ti で引く（波形レーンぶんズレるため）
  const lbl=el.querySelector('.lbl'); if(!lbl) return;
  lbl.textContent=proj.tracks[ti].clips[ci].text;

// ══ 選択中クリップの操作ハンドル（サイズ・回転・角丸）══
// 画像/映像に共通。プレビュー上で直感的に触れるようにする（数値はインスペクタと同じ値を書き換える）
function selClipEl(){
  if(!selected) return null;
  const tr=proj.tracks[selected.ti]; if(!tr) return null;
  if(tr.type==='image')
    return document.querySelector(`#ovlayer .ovimg[data-ti="${selected.ti}"][data-ci="${selected.ci}"]`);
  if(tr.type==='video'){ const v=videoEls[selected.ti+'-'+selected.ci]; return v?(v._wrap||v):null; }
  return null;
}
function syncSelBox(){
  const box=$('selbox'); if(!box) return;
  const el=selClipEl();
  const tr=selected&&proj.tracks[selected.ti];
  const c=tr&&tr.clips[selected.ci];
  // 表示中のクリップだけ。字幕/マスクは既存の枠ドラッグがあるので出さない
  const visible = el && c && el.style.display!=='none' && el.style.visibility!=='hidden'
                  && playTime>=c.start && playTime<c.end;
  box.classList.toggle('on', !!visible);
  if(!visible) return;
  const st=$('stagewrap').getBoundingClientRect(), r=el.getBoundingClientRect();
  // 回転している要素の getBoundingClientRect は外接矩形なので、枠は「回転前の寸法＋同じ回転」で描く。
  // ⚠️ 元寸法を getBoundingClientRect と回転角から逆算する式は 45°付近で cos(2a)=0 で破綻
  //    （選択枠が画面外へ飛んで回転ハンドルが触れなくなる 2026-07-23実害）。
  //    offsetWidth/offsetHeight は CSS transform を無視した「変形前の寸法」を返すため、それを直接使う。
  const rot = c.rotate || 0;
  const w = el.offsetWidth, h = el.offsetHeight;
  const cx = r.left + r.width / 2 - st.left, cy = r.top + r.height / 2 - st.top;
  box.style.left = (cx - w / 2) + 'px'; box.style.top = (cy - h / 2) + 'px';
  box.style.width = w + 'px'; box.style.height = h + 'px';
  box.style.transform = rot ? ('rotate(' + rot + 'deg)') : '';
  box.style.transformOrigin = 'center center';
}
function selHint(txt){
  const h=$('selHint');
  if(!txt){ h.style.display='none'; return; }
  h.textContent=txt; h.style.display='block';
}
function attachHandles(){
  const stage=()=>$('stagewrap').getBoundingClientRect();
  const cur=()=>{ const tr=proj.tracks[selected.ti]; return {tr,c:tr.clips[selected.ci]}; };
  // ── サイズ（右下） ──
  $('hSize').addEventListener('pointerdown',ev=>{
    ev.preventDefault(); ev.stopPropagation();
    const {tr,c}=cur(); const st=stage();
    const el=selClipEl(); const r0=el.getBoundingClientRect();
    const isImg=tr.type==='image';
    const base=isImg?(c.w==null?0.3:c.w):(c.scale==null?1:c.scale);
    const x0=ev.clientX, y0=ev.clientY;
    const diag0=Math.hypot(r0.width,r0.height)||1;
    ev.target.setPointerCapture(ev.pointerId);
    const mv=e=>{
      // 対角方向の伸びを比率にする（回転していても直感が変わらない）
      const d=Math.hypot(r0.width+(e.clientX-x0),r0.height+(e.clientY-y0));
      const k=Math.max(0.05,Math.min(6,d/diag0));
      const nv=Math.max(0.02,base*k);
      if(isImg) c.w=Math.round(nv*1000)/1000; else c.scale=Math.round(nv*1000)/1000;
      selHint('サイズ '+Math.round((isImg?c.w:c.scale)*100)+'%');
      isImg?updateImageVis():syncVideoToTime(); syncSelBox();
    };
    const up=()=>{ ev.target.removeEventListener('pointermove',mv); ev.target.removeEventListener('pointerup',up);
      selHint(''); pushHistory(); renderInspector(); };
    ev.target.addEventListener('pointermove',mv); ev.target.addEventListener('pointerup',up);
  });
  // ── 回転（上中央） ──
  $('hRot').addEventListener('pointerdown',ev=>{
    ev.preventDefault(); ev.stopPropagation();
    const {tr,c}=cur();
    const el=selClipEl(); const r=el.getBoundingClientRect();
    const cx=r.left+r.width/2, cy=r.top+r.height/2;
    // ⚠️ atan2 は -π..π しか返さないため、単純に差分を足すと 180°/-180° の境界で
    //   飛んで「一定角度で解除される」ように見える。前フレームとの差分をアンラップして
    //   累積することで360°ぐるぐる連続回転にする（回転回数の制限なし）
    let prevA=Math.atan2(ev.clientY-cy,ev.clientX-cx);
    let acc=c.rotate||0;   // 累積角度（度）。この値のまま保存
    ev.target.setPointerCapture(ev.pointerId);
    const mv=e=>{
      const a=Math.atan2(e.clientY-cy,e.clientX-cx);
      let da=a-prevA;
      if(da>Math.PI) da-=2*Math.PI;        // 上境界を跨いだ場合
      if(da<-Math.PI) da+=2*Math.PI;       // 下境界を跨いだ場合
      acc+=da*180/Math.PI;
      prevA=a;
      let deg=acc;
      if(e.shiftKey) deg=Math.round(deg/15)*15;                       // Shiftで15°刻み
      else if(Math.abs(((deg%360)+540)%360-180)<2) deg=Math.round(deg/360)*360;  // 各1回転付近で0°吸着
      deg=Math.round(deg*10)/10;
      c.rotate=deg; if(!deg) delete c.rotate;
      selHint('回転 '+deg.toFixed(1)+'°');
      tr.type==='image'?updateImageVis():syncVideoToTime(); syncSelBox();
    };
    const up=()=>{ ev.target.removeEventListener('pointermove',mv); ev.target.removeEventListener('pointerup',up);
      selHint(''); pushHistory(); renderInspector(); };
    ev.target.addEventListener('pointermove',mv); ev.target.addEventListener('pointerup',up);
  });
  // ── 角丸（左上・内側へドラッグ） ──
  $('hRad').addEventListener('pointerdown',ev=>{
    ev.preventDefault(); ev.stopPropagation();
    const {tr,c}=cur();
    const el=selClipEl(); const r=el.getBoundingClientRect();
    const short=Math.min(r.width,r.height)/2||1;
    const x0=ev.clientX, y0=ev.clientY, base=c.radius||0;
    ev.target.setPointerCapture(ev.pointerId);
    const mv=e=>{
      const d=((e.clientX-x0)+(e.clientY-y0))/2;         // 内側へ引くほど丸く
      let v=Math.max(0,Math.min(1,base+d/short));
      v=Math.round(v*100)/100;
      c.radius=v; if(!v) delete c.radius;
      selHint(v>=0.999?'角丸 円':'角丸 '+Math.round(v*100)+'%');
      tr.type==='image'?updateImageVis():syncVideoToTime();
    };
    const up=()=>{ ev.target.removeEventListener('pointermove',mv); ev.target.removeEventListener('pointerup',up);
      selHint(''); pushHistory(); renderInspector(); };
    ev.target.addEventListener('pointermove',mv); ev.target.addEventListener('pointerup',up);
  });
}
function showGuide(id,on){ $(id).style.display=on?'block':'none'; }
function hideGuides(){ showGuide('guideV',false); showGuide('guideH',false); }
// 位置指定できるガイド線: pos=0..1（0=左端/上端, 0.5=中央, 1=右端/下端）
function showGuideAt(id,on,pos){
  const el=$(id); if(!el) return;
  el.style.display=on?'block':'none';
  if(!on) return;
  if(id==='guideV') el.style.left=(pos*100)+'%';
  else el.style.top=(pos*100)+'%';

// 端＋中央スナップ。x/wは0..1正規化。
// ⚠️ プレビューは**画面外にはみ出した配置を許容する**（帯バナー x=-0.04 など既存動画で活用）。
//   端スナップが強すぎると、画面外へ出す途中で必ず端に吸われて抜けられない。対策:
//   ① 🧲吸着ボタンOFFなら全スナップ無効（既存タイムラインと一貫性）
//   ② 端スナップの閾値(0.008)を中央(0.02)より小さく＝端は「ほぼ触れた時だけ」吸う
function snapEdges(x,y,w,h){
  if(!snapEnabled){ hideGuides(); return {x,y}; }
  const TC=0.02;   // 中央スナップの閾値（従来）
  const TE=0.008;  // 端スナップは弱く（意図的な画面外配置を邪魔しない）
  let gx=null, gy=null;
  // X: 左端(0) / 右端(1) / 中央(0.5)。中央を最後に評価＝端優先
  if(Math.abs(x)<TE){ x=0; gx=0; }
  else if(Math.abs(x+w-1)<TE){ x=1-w; gx=1; }
  else if(Math.abs(x+w/2-0.5)<TC){ x=0.5-w/2; gx=0.5; }
  // Y: 上端(0) / 下端(1) / 中央(0.5)
  if(Math.abs(y)<TE){ y=0; gy=0; }
  else if(Math.abs(y+h-1)<TE){ y=1-h; gy=1; }
  else if(Math.abs(y+h/2-0.5)<TC){ y=0.5-h/2; gy=0.5; }
  showGuideAt('guideV', gx!=null, gx==null?0:gx);
  showGuideAt('guideH', gy!=null, gy==null?0:gy);
  return {x,y};
}
function updateCap(){
  const ov=$('capov'); if(!ov) return;
  ov.innerHTML='';
  const stageW=ov.getBoundingClientRect().width||300;
  proj.tracks.forEach((tr,ti)=>{
    if(tr.type!=='caption'||tr.hidden) return;
    tr.clips.forEach((c,ci)=>{
      if(!(playTime>=c.start&&playTime<c.end)) return;
      const b=capBox(c);
      const it=document.createElement('div');
      it.className='capitem'+(isSel(ti,ci)?' sel':'');
      it.style.left=(b.x*100)+'%'; it.style.top=(b.y*100)+'%';
      it.style.width=(b.w*100)+'%'; it.style.height=(b.h*100)+'%';
      it.style.zIndex=trackZ(ti);
      it.style.justifyContent={top:'flex-start',middle:'center'}[c.valign]||'flex-end';
      it.dataset.ti=ti; it.dataset.ci=ci;
      const fs=(c.fontsize||proj.style.fontsize||46)*stageW/(proj.canvas.w||1080);
      const line=document.createElement('div'); line.className='cap-line';
      line.style.textAlign=c.align||'center';
      const s=document.createElement('span'); s.textContent=c.text;
      s.style.color=cssColor(capTextColor(c));
      s.style.fontSize=fs+'px';
      s.style.fontFamily=capFontCss(c.font||proj.style.font);
      s.style.fontWeight=c.bold?'800':'400';
      s.style.fontStyle=c.italic?'italic':'normal';
      const deco=[]; if(c.underline)deco.push('underline'); if(c.strike)deco.push('line-through');
      s.style.textDecoration=deco.length?deco.join(' '):'none';
      if(capHiOn(c)){ s.style.background=cssColor(capHiColor(c)); s.style.padding='2px 7px'; }
      else { s.style.background='transparent'; s.style.padding='0'; }
      if(c.outline){ const ow=(c.outlineWidth||2)*stageW/(proj.canvas.w||1080);
        s.style.webkitTextStroke=ow.toFixed(1)+'px '+cssColor(c.outlineColor||[0,0,0]); }
      if(c.shadow){ const so=Math.max(1,fs*0.06);
        s.style.textShadow=so.toFixed(1)+'px '+so.toFixed(1)+'px '+(so*1.2).toFixed(1)+'px '
          +cssColor((c.shadowColor||[0,0,0]).concat(Math.round((c.shadowOpacity==null?0.6:c.shadowOpacity)*255))); }
      // 縦書き: 日本語の縦書き。writing-mode:vertical-rl と同じルール（右→左に列を並べる）
      if(c.vertical){
        s.style.writingMode='vertical-rl';
        line.style.display='flex';
        line.style.justifyContent=c.align==='left'?'flex-end':c.align==='right'?'flex-start':'center';
      }
      line.appendChild(s); it.appendChild(line);
      attachCapDrag(it,ti,ci);
      ov.appendChild(it);
      // ↑CSS簡易版を組み立てた後に呼ぶ（キャッシュヒット時は同期でput()が走るため、
      //   子要素が出来る前に呼ぶとCSS版を隠せずPNGと二重に見える）
      requestCapPng(it,c,ti);  // レンダラと同一実装のPNGを重ねる（CSS版は取得までの代役／ドラッグ中の表示）
    });
  });
}
// ---- 字幕プレビュー: レンダラと同一実装(render_caption_image)のPNGを重ねる ----
// CSSでの再現は折り返し・行高・座布団形状が書き出しとズレる（今日の「H/DMI」事故はプレビューで見えなかった）。
// サーバに描かせて重ねることで、描画エンジンが1本化され原理的にズレなくなる。
// ドラッグ/リサイズ中だけはCSS簡易表示に戻す（毎フレームHTTPを叩かないため）。
let capPngCache={};   // キー(=clipの内容) -> blob URL
let capDragging=false;
function capKey(c){
  return JSON.stringify([c.text,c.x,c.y,c.w,c.h,c.align,c.valign,c.fontsize,c.font,c.bold,c.italic,
    c.underline,c.strike,c.highlight,c.highlightColor,c.textColor,c.color,c.outline,c.outlineColor,
    c.outlineWidth,c.shadow,c.shadowColor,c.shadowOpacity,c.speaker,c.panel,c.rotate,c.emphasisColor,
    c.vertical,
    proj.canvas.w,proj.canvas.h,proj.style&&proj.style.font,proj.style&&proj.style.fontsize]);
}
async function requestCapPng(it,c,ti){
  // it=capitem（枠・ドラッグの当たり判定）。PNGは別レイヤーに敷く
  // （capitem自体を全面にするとドラッグの当たり判定が画面全体に広がってしまう）
  if(capDragging) return;                       // ドラッグ中はCSS簡易表示のまま
  const key=capKey(c);
  const put=url=>{
    const ov=$('capov'); if(!ov) return;
    let png=it._png;
    if(!png){
      png=document.createElement('div'); png.className='cappng';
      png.style.zIndex=trackZ(ti); ov.appendChild(png); it._png=png;
    }
    png.style.backgroundImage='url('+url+')';
    // 登場アニメ(pop=スタンプ): 書き出し(1.9倍→等倍0.16秒の叩きつけ+0.06秒フェード)と同じ進行を再現
    if(c.anim==='pop'){
      const dt=Math.max(0,playTime-c.start);
      const k=Math.min(1,dt/0.16);
      const sc=1.9-0.9*k*k;
      png.style.transformOrigin='center center';
      png.style.transform=sc>1.001?'scale('+sc.toFixed(4)+')':'';
      png.style.opacity=Math.min(1,dt/0.06).toFixed(2);
    } else { png.style.transform=''; png.style.opacity=''; }
    Array.from(it.children).forEach(ch=>ch.style.visibility='hidden');  // CSS簡易版を隠す
  };
  if(capPngCache[key]) return put(capPngCache[key]);
  try{
    const r=await fetch('/api/caption-preview',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({clip:c,canvas:proj.canvas,style:proj.style||{}})});
    if(!r.ok) return;                            // 失敗時はCSS簡易表示のまま（プレビューが消えないように）

function attachCapDrag(el,ti,ci){

    const r=el.getBoundingClientRect();
    const resize=(ev.clientX>r.right-16 && ev.clientY>r.bottom-16);
    const b0=capBox(c);
    const x0=ev.clientX,y0=ev.clientY;
    let moved=false;

    if(el._png){ el._png.remove(); el._png=null; }

    const mv=e=>{
      const dx=(e.clientX-x0)/stage.width, dy=(e.clientY-y0)/stage.height;
      if(Math.abs(e.clientX-x0)+Math.abs(e.clientY-y0)>3) moved=true;
      if(resize){

        c.h=round3(Math.min(1-b0.y,Math.max(0.06,b0.h+dy)));

      } else {
        const w=c.w==null?b0.w:c.w, h=c.h==null?b0.h:c.h;
        let nx=b0.x+dx, ny=b0.y+dy;
        // 画面外に**はみ出した配置も許容**する（帯バナー x=-0.04 等の既存動画で活用）。

        const sn=snapEdges(nx,ny,w,h); nx=sn.x; ny=sn.y;

      const b=capBox(c);

function updateImageVis(){
  const layer=$('ovlayer'); if(!layer) return;
  layer.querySelectorAll('.ovimg').forEach(im=>{
    const c=proj.tracks[+im.dataset.ti].clips[+im.dataset.ci];
    const on=(playTime>=c.start && playTime<c.end);
    im.style.display=on?'block':'none';
    // Ken Burns（motion.zoom）: 書き出しと同じ「クリップ進行に応じた中央基準ズーム」の近似。
    // （書き出しは枠内クロップで寄る。プレビューは要素自体が僅かに広がる簡易表現）
    const z=c.motion&&c.motion.zoom;
    let s=1;
    if(on&&z&&Math.abs(z-1)>1e-3){
      const prog=Math.max(0,Math.min(1,(playTime-c.start)/Math.max(0.01,c.end-c.start)));
      s=z>=1?(1+(z-1)*prog):(1/z-(1/z-1)*prog);
    }
    // フェード/不透明度（書き出しの fade=alpha / colorchannelmixer と同じ意味）
    let op=(c.opacity==null?1:c.opacity);
    if(on){ const local=playTime-c.start, idur=c.end-c.start;
      if(c.fadeIn && local<c.fadeIn) op*=Math.max(0,local/c.fadeIn);
      if(c.fadeOut && local>idur-c.fadeOut) op*=Math.max(0,(idur-local)/c.fadeOut); }
    im.style.opacity=(on&&op<1)?op:'';
    // パン（書き出しは切り出し窓の移動。プレビューは逆方向の平行移動で近似。
    //  パン単独は書き出しと同じく固定ズーム1.1で全域を横断する）
    const pan=on&&c.motion&&c.motion.pan; let tx=0,ty=0;
    if(pan){ const zp=(z&&Math.abs(z-1)>1e-3)?z:1.1;
      if(!(z&&Math.abs(z-1)>1e-3)) s=zp;
      const m=(1-1/zp)*100;
      const prog=Math.max(0,Math.min(1,(playTime-c.start)/Math.max(0.01,c.end-c.start)));
      const d=(prog-0.5)*m;
      if(pan==='left') tx=d; else if(pan==='right') tx=-d;
      else if(pan==='up') ty=d; else if(pan==='down') ty=-d; }
    const rot=c.rotate||0;                    // 回転（書き出しと同じく時計回りが正・中心基準）
    im.style.transformOrigin='center center';
    // 反転は書き出し（PILで最初に反転）と同じ意味＝transform末尾（＝最初に適用される）に置く
    im.style.transform=(on&&(s!==1||rot||tx||ty||c.flip))
      ? 'rotate('+rot+'deg) scale('+s.toFixed(4)+') translate('+tx.toFixed(2)+'%,'+ty.toFixed(2)+'%)'+(c.flip?' scaleX(-1)':'') : '';
    im.style.filter=on?colorFilterCSS(c):'';  // 色調整（書き出しの apply_color と同じ意味）
    // 角丸（書き出しのrounded_mask相当。100%=中央の正円=clip-path circle）
    const rad=c.radius||0;
    if(on&&rad>=0.999){ im.style.clipPath='circle(closest-side)'; im.style.borderRadius=''; }
    else if(on&&rad>0){ im.style.clipPath=''; im.style.borderRadius=(rad*Math.min(im.offsetWidth,im.offsetHeight)/2)+'px'; }
    else { im.style.clipPath=''; im.style.borderRadius=''; }
  });
}

// レンダラは全映像クリップをz順に重ねる。プレビューも同じく**その瞬間の全クリップを同時表示**する

function syncVideoToTime(){

  for(const k in videoEls){
    if(live.has(k)) continue;
    const v=videoEls[k];

  }
  act.forEach(({c,ti,ci,key})=>{

// レンダラと同じ意味の crop → 目標幅へフィット → 配置 を、外枠(w)＋中身(v)の2層で再現する。
//   レンダラ: crop=iw*(1-l-r):ih*(1-t-b):iw*l:ih*t  →  scale=W*sc:-2  →  overlay=x:y
//   ここ    : 外枠=crop後の表示box（幅 sc・高さはcrop後アスペクト）／中身=元映像を 1/kw 倍に広げて
//             crop分を外へ押し出す（overflow:hidden で切れる）
// 旧実装は clip-path で端を隠すだけ＝拡大も再配置もせず、書き出しと全く違う絵になっていた。
function applyVideoLayout(w,v,c){
  const cr=(c.crop&&c.crop.some(x=>x))?c.crop:null;
  const l=cr?(+cr[0]||0):0, t=cr?(+cr[1]||0):0, r=cr?(+cr[2]||0):0, b=cr?(+cr[3]||0):0;
  const kw=Math.max(0.05,1-l-r), kh=Math.max(0.05,1-t-b);   // レンダラと同じ下限クランプ
  const sc=(c.scale==null?1:c.scale);
  const srcW=v.videoWidth||16, srcH=v.videoHeight||9;
  const cw=proj.canvas.w||1080, ch=proj.canvas.h||1920;
  // 外枠: 幅=ステージ幅×sc / 高さ=crop後のアスペクトで決まる（ステージ高さに対する%）
  w.style.width=(sc*100)+'%';
  w.style.height=(sc*(cw/ch)*((srcH*kh)/(srcW*kw))*100)+'%';
  // 中身: 1/kw に広げ、crop の左上ぶんを負のオフセットで外へ出す（%は親のw/hが基準）
  v.style.width=(100/kw)+'%';
  v.style.left=(-(l/kw)*100)+'%';
  v.style.top=(-(t/kh)*100)+'%';
  const rt=c.rotate?(' rotate('+c.rotate+'deg)'):'';   // 回転（書き出しと同じ時計回り・中心基準）
  const fl=c.flip?' scaleX(-1)':'';    // 反転（書き出しはhflipが回転より先＝transform末尾に置く）
  if(c.x!=null&&c.y!=null){            // ワイプ/PiP: 正規化左上へ
    w.style.left=(c.x*100)+'%'; w.style.top=(c.y*100)+'%'; w.style.transform=(rt+fl).trim();
  } else if(sc===1&&!cr){              // 全画面かつcrop無し: レンダラは overlay=0:0
    w.style.left='0'; w.style.top='0'; w.style.transform=(rt+fl).trim();
  } else {                             // それ以外: レンダラは中央配置 (W-w)/2:(H-h)/2
    w.style.left='50%'; w.style.top='50%'; w.style.transform='translate(-50%,-50%)'+rt+fl;
  }
  w.style.transformOrigin='center center';
  // 角丸（書き出しのalphamerge角丸マスク相当。100%=中央の正円）。外枠がoverflow:hiddenなのでここで切る
  const rad=c.radius||0;
  if(rad>=0.999){ w.style.clipPath='circle(closest-side)'; w.style.borderRadius=''; }
  else if(rad>0){ w.style.clipPath=''; w.style.borderRadius=(rad*Math.min(w.offsetWidth,w.offsetHeight)/2)+'px'; }
  else { w.style.clipPath=''; w.style.borderRadius=''; }
}

function updateCtrl(){
  $('playBtn').textContent=playing?'⏸':'▶';
  // 経過・尺とも「書き出し後（カット後）」で表示。カットがあれば元尺も併記
  const cut=cutsTotal();
  $('tlabel').textContent=fmtT(outTimeOf(playTime))+' / '+fmtT(outDur())+(cut>0.05?('（元'+fmtT(realDur())+'）'):'');
  const sk=$('seek'); sk.max=realDur().toFixed(2); sk.value=playTime.toFixed(2);

function refreshFrame(){ syncVideoToTime(); updateCap(); updateImageVis(); updateMaskVis(); syncPlayhead(); updateCtrl(); syncSelBox(); }
function seekTo(t){ playTime=Math.max(0,Math.min(t,realDur())); refreshFrame(); }

function tick(now){
  if(!playing) return;
  const dt=(now-lastTs)/1000; lastTs=now;
  if(skipCut()){ syncVideoToTime(); }   // カット区間に入ったら飛ばす（書き出しと同じ見え方に）
  const c=activeVClip(playTime);
  const v=c?vElOf(c):null;
  if(c && v){
    // 別クリップが同じ要素を使っていた場合に備え、大きくズレていたら合わせる
    const target=(c.in||0)+(playTime-c.start);
    const vd=isFinite(v.duration)?v.duration:Infinity;
    if(v.ended || target>=vd-0.02){
      // ソース終端に到達。終了済み要素に play() すると先頭へ巻き戻る(HTML5仕様)ため呼ばず、
      // 実時間で進めて次のクリップへ渡す
      playTime += dt;
    } else {
      if(v.paused || Math.abs(v.currentTime-target)>0.3){ v.currentTime=target; v.play().catch(()=>{}); }
      playTime = c.start + (v.currentTime-(c.in||0));   // 映像クロックで進める（A/V同期）
    }
  } else {
    pauseAllV();          // ギャップ（映像なし）は実時間で進める
    playTime += dt;
  }
  // 終端（＝一番右端のクリップの終わり）。ループONなら止めずに先頭へ戻す
  if(playTime>=realDur()){
    if(loopEnabled){
      playTime=0;
      // 映像/音声は「前のクリップの続き」だと思って再生中なので、頭出しし直す。
      // これをしないと巻き戻った直後だけ絵と音がズレる
      pauseAllV(); pauseAllA();
      for(const k in videoEls){ try{ videoEls[k].currentTime=0; }catch(_){} }
      syncVideoToTime(); syncAudioToTime(); updateCap(); updateImageVis(); syncPlayhead(); updateCtrl();
      rafId=requestAnimationFrame(tick);
      return;
    }
    playTime=realDur(); stop(); refreshFrame(); return;
  }
  syncVideoToTime(); syncAudioToTime(); updateCap(); updateImageVis(); syncPlayhead(); updateCtrl();
  rafId=requestAnimationFrame(tick);
}
function play(){
  if(playing) return;
  // 初回再生（＝ユーザー操作）でWebAudioバスを起動。以降クリップgainが書き出しと同じ倍率で効く
  try{ ensureAudioGraph(); if(audioCtx&&audioCtx.state==='suspended') audioCtx.resume(); }catch(_){}
  if(playTime>=realDur()) playTime=0;
  playing=true; lastTs=performance.now();
  syncVideoToTime(); syncAudioToTime();
  rafId=requestAnimationFrame(tick);
  updateCtrl();
}
function stop(){ playing=false; if(rafId) cancelAnimationFrame(rafId); pauseAllV(); pauseAllA(); updateCtrl(); }

  const q=p.toString()?('?'+p.toString()):'';
  const r=await fetch('/api/project'+q,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(proj)});
  if(r.status===409){  // 別プロジェクトに切替 or 他所で更新済み＝この画面の状態は捨てて読み直す
    let d={}; try{d=await r.json();}catch(_){}

function placeClip(tr, clip, start, label){
  const len=clip.end-clip.start;
  const s=findFreeStart(tr.clips, start, len);
  clip.start=s; clip.end=round(s+len);
  tr.clips.push(clip);
  selected={ti:proj.tracks.indexOf(tr), ci:tr.clips.length-1};
  pushHistory(); build();
  setStatus(Math.abs(s-round(start))>1e-6 ? label+'（重なるため '+fmt(s)+' へずらしました）' : label);

  const src=proj.tracks[clipboard.ti];
  const tr=(src && src.type===clipboard.type) ? src : proj.tracks.find(t=>t.type===clipboard.type);
  if(!tr) return;
  placeClip(tr, JSON.parse(JSON.stringify(clipboard.clip)), playTime, '⧉ ペースト');

async function doExport(){
  exporting=true;
  const g=$('expGo'); g.disabled=true; g.textContent='書き出し中…';
  const box=$('expResult'); box.style.display='flex';
  // 進捗: ffmpegの実進捗は取れないので、尺から推定した見込み時間で埋めつつ経過秒を出す
  // （何も出ないと「固まったのか動いているのか」が分からない）
  box.innerHTML='<div style="width:100%"><div id="expBarWrap" style="height:6px;background:#0e1015;border-radius:3px;overflow:hidden">'
    +'<div id="expBar" style="height:100%;width:0%;background:var(--accent);transition:width .25s"></div></div>'
    +'<div id="expMsg" style="margin-top:7px">⏳ 準備中…</div></div>';
  const t0=Date.now(), est=Math.max(6,realDur()*0.35);   // 実測: 35秒の動画で約7-10秒
  const timer=setInterval(()=>{
    const el=(Date.now()-t0)/1000;
    const pct=Math.min(95,(1-Math.exp(-el/est))*100);    // 100%には到達させない（完了時に100へ）
    const bar=$('expBar'), msg=$('expMsg');
    if(bar) bar.style.width=pct.toFixed(0)+'%';
    if(msg) msg.textContent='⏳ 書き出し中… '+el.toFixed(0)+'秒経過'
      +(el>est*2?'（大きい動画や初回は時間がかかります）':'');
  },250);
  const endProgress=()=>{ clearInterval(timer); const b=$('expBar'); if(b) b.style.width='100%'; };
  // 保存が通らない状態（409=他所で更新済み等）で書き出すと、古い内容を無言でレンダしてしまう
  let saved=false;
  try{ saved=await postProject(); }catch(_){ saved=false; }
  if(!saved){
    clearInterval(timer);
    box.textContent='⚠️ 保存できないため書き出しを中止しました。画面を再読み込みしてから再度お試しください。';
    exporting=false; g.disabled=false; g.textContent='書き出す';
    return;
  }
  setStatus('💾 保存してから書き出します');
  try{
    // 範囲（両方入っていて 開始<終了 のときだけ送る。片側だけなら 0/末尾 で補完）
    const ra=parseFloat($('expRa').value), rb=parseFloat($('expRb').value);
    let range=null;
    if(!isNaN(ra)||!isNaN(rb)){
      const a=isNaN(ra)?0:Math.max(0,ra), b=isNaN(rb)?realDur():rb;
      if(b>a) range=[a,b];
    }
    const r=await fetch('/api/export',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({format:EXP.fmt,quality:EXP.q,height:EXP.h?parseInt(EXP.h,10):null,
                           range:range,
                           save_dir:EXP.dest==='folder'?EXP.dir:'~/Downloads'})});
    if(r.ok){
      const d=await r.json();
      endProgress();
      box.innerHTML='';
      const t=document.createElement('span');
      t.textContent='✅ '+(d.saved_to?d.saved_to.split('/').pop():d.name)+'（'+fmtSize(d.size)+'）'
        +(d.saved_to?' → '+d.saved_to.replace(/\/[^\/]+$/,''):'');
      box.appendChild(t);
      const rv=document.createElement('button'); rv.textContent='Finderで表示';
      rv.style.fontSize='12px'; rv.style.padding='4px 9px';
      const rq=d.saved_to?'path='+encodeURIComponent(d.saved_to):'name='+encodeURIComponent(d.name);
      rv.addEventListener('click',()=>fetch('/api/reveal?'+rq,{method:'POST'}));
      box.appendChild(rv); setStatus('✅ 書き出し完了（'+d.name+'）');
    } else {
      let e={}; try{e=await r.json();}catch(_){}
      clearInterval(timer);
      box.textContent='⚠️ 書き出し失敗: '+(e.err||r.status);
    }
  }catch(_){ clearInterval(timer); box.textContent='⚠️ 書き出し失敗（サーバー未応答）'; }
  exporting=false; g.disabled=false; g.textContent='書き出す';
}

// ホイール操作（issue #3 の割当。「素ホイール=ズーム」はスクロールを奪うのでやめた）:
//   タイムライン本体: 素ホイール=縦スクロール（通常挙動） / Shift+ホイール=横スクロール
//   ルーラー・ツールバーの上: 素ホイール=ズーム（時間軸の上なので直感的）
//   Ctrl(⌘)+ホイール: どこでもズーム。Macのトラックパッドのピンチはブラウザ仕様で
//   ctrlKey付きwheelとして届くため、ピンチズームも自動的にここに乗る
function wheelZoom(e){
  const wrap=$('tlwrap'), rect=wrap.getBoundingClientRect();
  const cx=e.clientX-rect.left;
  const t=(cx+wrap.scrollLeft)/scale;              // カーソル下の時刻
  const ns=Math.min(400,Math.max(20,scale*Math.exp(-e.deltaY*0.002)));
  if(ns===scale) return;
  scale=ns; build();
  wrap.scrollLeft=Math.max(0,t*scale-cx);          // 同じ時刻がカーソル下に来るよう補正
}

  if(e.ctrlKey||e.metaKey){ e.preventDefault(); wheelZoom(e); return; }   // ズーム
  if(e.shiftKey){ e.preventDefault(); $('tlwrap').scrollLeft+=(e.deltaY||e.deltaX); return; } // 横スクロール(Win)
  // 素ホイール: preventDefaultせず通常のスクロールに任せる（縦=トラック一覧 / deltaX=横パン）
},{passive:false});

}

// ---- トラックの追加・削除 ----
function trackDefaults(type){
  const n=proj.tracks.filter(t=>t.type===type).length+1;
  if(type==='caption') return {id:'caption'+n,type:'caption',label:'字幕'+(n>1?n:''),clips:[]};
  if(type==='image')   return {id:'image'+n,type:'image',label:'画像'+(n>1?n:''),clips:[]};
  if(type==='audio')   return {id:'audio'+n,type:'audio',label:'🎵 音声'+(n>1?n:''),clips:[]};
  if(type==='mask')    return {id:'mask'+n,type:'mask',label:'マスク'+(n>1?n:''),clips:[]};
  return {id:type+n,type:type,label:type,clips:[]};
}
function addTrack(type){
  const tr=trackDefaults(type);
  proj.tracks.push(tr);
  selected=null; pushHistory(); build(); setStatus('＋'+(tr.label)+' トラックを追加');
}
function deleteTrack(ti){
  const tr=proj.tracks[ti]; if(!tr) return;
  if(tr.type==='video' && proj.tracks.filter(t=>t.type==='video').length<=1){ setStatus('映像トラックは削除できません'); return; }
  if((tr.clips&&tr.clips.length) && !confirm('「'+(tr.label||tr.type)+'」を中身ごと削除しますか？')) return;
  proj.tracks.splice(ti,1);
  if(selected&&selected.ti===ti) selected=null;
  pushHistory(); build(); setStatus('トラックを削除しました');
}

function fmtAgo(ms){
  const s=(Date.now()-ms*1000)/1000;
  if(s<60) return 'たった今'; if(s<3600) return Math.floor(s/60)+'分前';
  if(s<86400) return Math.floor(s/3600)+'時間前';
  if(s<86400*30) return Math.floor(s/86400)+'日前';
  return new Date(ms*1000).toLocaleDateString('ja-JP');
}

function timeFromClientX(clientX){
  const rect=$('timeline').getBoundingClientRect();
  return Math.max(0,(clientX-rect.left)/scale);
}
async function addVideoFile(file,atTime,track){
  setStatus('⤴ 動画を取り込み中…');
  let name; try{ name=await uploadFile(file); }catch(_){ setStatus('⚠️ 取り込み失敗'); return; }
  const dur=await new Promise(res=>{
    const v=document.createElement('video'); v.preload='metadata';
    v.onloadedmetadata=()=>res(isFinite(v.duration)&&v.duration>0?v.duration:5);
    v.onerror=()=>res(5);
    v.src='/src?name='+encodeURIComponent(name)+'&t='+Date.now();
  });
  let tr=track||proj.tracks.find(t=>t.type==='video');
  if(!tr){ tr={id:'video',type:'video',label:'映像',clips:[]}; proj.tracks.unshift(tr); }
  const s=findFreeStart(tr.clips, atTime==null?playTime:atTime, dur);   // 重なるなら空きへ送る
  tr.clips.push({src:name,start:s,end:round(s+dur),in:0});
  selected={ti:proj.tracks.indexOf(tr),ci:tr.clips.length-1};
  pushHistory(); build(); setStatus('🎬 動画を追加（'+name+'）');
  return round(s+dur);   // 複数ファイル連続ドロップで次の開始位置に使う
}
// ドロップ位置(Y)のレーンからトラックを特定。ファイル種別と合うトラックならそこへ入れる
function laneFromClientY(clientY){
  const lanes=[...document.querySelectorAll('#timeline .lane')];
  for(const l of lanes){
    const r=l.getBoundingClientRect();
    if(clientY>=r.top && clientY<=r.bottom) return l;
  }
  return null;
}
function kindOfFile(f){
  if(f.type.startsWith('image/')) return 'image';
  if(f.type.startsWith('audio/')) return 'audio';
  if(f.type.startsWith('video/')) return 'video';
  return null;
}
// ドロップ先トラック: 落としたレーンが同じ種別ならそのトラック。違えば null（＝既定の探索に任せる）
function dropTargetTrack(f,clientY){
  if(clientY==null) return null;
  const lane=laneFromClientY(clientY);
  if(!lane) return null;
  const kind=kindOfFile(f);
  if(!kind || lane.dataset.type!==kind) return null;
  return proj.tracks[+lane.dataset.ti]||null;
}
// 想定尺（実尺はDL後にしか分からない。ここは重なりチェックの下限値。画像は既定4秒、他は1秒を仮＝
// 実尺で拡張すると初めて隣に食い込むが、その時は既存のリサイズガードで赤くなる）
function estimateDur(f){ return f.type.startsWith('image/') ? 4 : 1; }
// ドロップ位置で既存クリップに重なるか（ドロップ先が特定できる時だけ厳密に判定）
function dropWouldOverlap(f,atTime,clientY){
  const tr=dropTargetTrack(f,clientY);
  if(!tr) return false;                          // 落とし先が未特定なら止めない（既定探索に任せる）
  const s=atTime, e=atTime+estimateDur(f);
  return tr.clips.some(c=>s<c.end-1e-6 && e>c.start+1e-6);
}
async function handleDrop(files,atTime,clientY){
  // 複数ファイルを一度にドロップしたら、実尺ぶん後ろへ並べる。
  // 以前は atTime を更新しなかったため、画像を5枚まとめて落とすと5枚とも同じ位置に完全に重なった
  let at=atTime;
  for(const f of files){
    const tr=dropTargetTrack(f,clientY);
    let next=null;
    if(f.type.startsWith('image/')) next=await addImageFile(f,at,tr);
    else if(f.type.startsWith('audio/')) next=await addAudioFile(f,at,tr);
    else if(f.type.startsWith('video/')) next=await addVideoFile(f,at,tr);
    else setStatus('⚠️ 未対応のファイル形式: '+(f.type||f.name));
    if(next!=null) at=next;
  }
}
(function(){
  const zone=$('tlwrap');
  const stop=e=>{ e.preventDefault(); e.stopPropagation(); };
  let hot=null;  // ドロップ先としてハイライト中のレーン
  const clearHot=()=>{ if(hot){ hot.classList.remove('drop-target','drop-bad'); hot=null; } };
  const markHot=e=>{
    // ⚠️ dragover の時点では File本体は取れず、items(kind='file',type)しか見えない
    const items=[...(e.dataTransfer.items||[])];
    const it=items[0];
    const kind=it?(it.type.startsWith('image/')?'image':it.type.startsWith('audio/')?'audio':it.type.startsWith('video/')?'video':null):null;
    const lane=laneFromClientY(e.clientY);
    clearHot();
    if(!lane||!kind||lane.dataset.type!==kind) return;
    const tr=proj.tracks[+lane.dataset.ti];
    // 重なり判定（クリップ内移動と同じ規則）: 想定尺は image=4s / audio・video=1s
    const dur = kind==='image' ? 4 : 1;
    const s=timeFromClientX(e.clientX), en=s+dur;
    const bad=tr&&tr.clips.some(c=>s<c.end-1e-6 && en>c.start+1e-6);
    lane.classList.add(bad?'drop-bad':'drop-target');
    hot=lane;
  };
  ['dragenter','dragover'].forEach(ev=>zone.addEventListener(ev,e=>{ stop(e); zone.classList.add('dragover'); e.dataTransfer.dropEffect='copy'; markHot(e); }));
  ['dragleave','dragend'].forEach(ev=>zone.addEventListener(ev,e=>{ stop(e); if(e.target===zone){ zone.classList.remove('dragover'); clearHot(); } }));
  zone.addEventListener('drop',e=>{ stop(e); zone.classList.remove('dragover');
    const wasBad=hot && hot.classList.contains('drop-bad');
    clearHot();
    const fs=[...(e.dataTransfer.files||[])];
    if(!fs.length) return;
    // 同トラックの既存クリップと重なる位置はキャンセル（クリップ移動の赤＝離すとキャンセルと同じ規則）
    const atTime=timeFromClientX(e.clientX);
    if(wasBad || fs.some(f=>dropWouldOverlap(f,atTime,e.clientY))){
      setStatus('⚠️ 既存クリップと重なるためドロップできません（別トラックか空きスペースへ）');
      return;
    }
    handleDrop(fs,atTime,e.clientY);
  });
  const pv=$('previewBox');
  ['dragenter','dragover'].forEach(ev=>pv.addEventListener(ev,e=>{ stop(e); e.dataTransfer.dropEffect='copy'; }));
  pv.addEventListener('drop',e=>{ stop(e); const fs=[...(e.dataTransfer.files||[])]; if(fs.length) handleDrop(fs,playTime); });
})();

// 上下の高さ調整（tlbarの上のバー）: 上へドラッグ=プレビューを縮めてタイムラインを広げる
(function(){
  const h=$('tlResize'), box=$('previewBox'), top=document.querySelector('.top');
  if(!h||!box||!top) return;
  h.addEventListener('pointerdown',ev=>{
    ev.preventDefault(); h.classList.add('drag');
    const y0=ev.clientY, h0=top.offsetHeight, w0=box.getBoundingClientRect().width;
    // .top の高さ = ステージ(幅に比例) + 固定部(再生バー等)。固定部を差し引いてカーソルに追従させる
    const st=document.querySelector('.stage');
    const stH0=st?st.offsetHeight:h0, fixed=h0-stH0, rate=stH0/Math.max(1,w0);
    h.setPointerCapture(ev.pointerId);
    const mv=e=>{
      const wantStage=Math.max(40,(h0+(e.clientY-y0))-fixed);
      const w=Math.max(150,Math.min(900,wantStage/Math.max(0.01,rate)));
      box.style.width=Math.round(w)+'px'; syncInspectorHeight();
    };
    const up=()=>{ h.classList.remove('drag'); try{h.releasePointerCapture(ev.pointerId);}catch(_){} h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); };
    h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
  });
})();

function splitAt(){
  if(!selected){ setStatus('分割したいクリップを選び、プレイヘッド(赤線)を内側に置いて✂️分割'); return; }
  const tr=proj.tracks[selected.ti], c=tr.clips[selected.ci];
  const t=round(playTime);
  if(t<=c.start+0.05||t>=c.end-0.05){ setStatus('プレイヘッド(赤線)をそのクリップの内側に置いてください'); return; }
  const c2=JSON.parse(JSON.stringify(c));
  // in（ソース内オフセット）は素材を参照する型すべてで継承する。
  // 音声を漏らすと後半クリップが曲の先頭から鳴り直す（render.py:668 も音声の in を読む）
  if(tr.type==='video'||tr.type==='audio'){ c2.in=round((c.in||0)+(t-c.start)); }
  c.end=t; c2.start=t;
  tr.clips.splice(selected.ci+1,0,c2);
  selected={ti:selected.ti,ci:selected.ci+1};
  pushHistory(); build(); setStatus('分割しました（不要な側を選んで削除できます）');
}

// ---- エフェクト ----
// 2種類に割り切る（CapCutの二分法。プロ系の「調整レイヤー」は小規模には過剰）:
//   ・オーバーレイ型 … タイムラインに「ただのクリップ」として置く（集中線など）。尺・位置を持つ
//   ・クリップ属性型 … 選択中クリップにプロパティを付ける（ズーム・角丸・登場アニメ）
// ⚠️ オーバーレイは専用トラックを毎回作らない。既存の画像トラックの空きを探して置く
//    （押すたびトラックが増えるのは編集ソフトとして異常。2026-07-17指摘）

// オーバーレイの置き先: 前面の画像トラックのうち、その区間が空いているものを使う。
// 全部埋まっているときだけ新しいトラックを作る（既存クリップを踏まないため）
function overlayTrackFor(st,en){
  const cands=proj.tracks.filter(t=>t.type==='image'&&!t.hidden);
  for(const t of cands){
    if(!t.clips.some(c=>c.start<en-1e-6 && c.end>st+1e-6)) return t;   // 区間が重ならない
  }
  const t={id:'fx'+Date.now(),type:'image',label:'✨ エフェクト',clips:[]};
  proj.tracks.unshift(t);   // 先頭＝最前面
  return t;
}

async function applyFx(kind){
  // --- オーバーレイ型 ---
  if(kind==='lines'){
    try{
      const r=await fetch('/api/gen-fx',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({w:proj.canvas.w,h:proj.canvas.h})});
      if(!r.ok){ const e=await r.json().catch(()=>({})); setStatus('❌ 集中線の生成に失敗: '+(e.err||('HTTP '+r.status))); return; }
      const {src}=await r.json();
      const st=round(playTime), en=round(st+1.2);
      const tr=overlayTrackFor(st,en);
      tr.clips.push({src,start:st,end:en,x:0,y:0,w:1});
      tr.clips.sort((a,b)=>a.start-b.start);
      selected={ti:proj.tracks.indexOf(tr),ci:tr.clips.findIndex(c=>c.start===st)};
      pushHistory(); build();
      setStatus('⚡ 集中線を挿入（'+tr.label+'）。衝撃の一撃だけに使う・効果音と同時が効く');
    }catch(ex){ setStatus('❌ 集中線の挿入に失敗: '+ex); }
    return;
  }
  // --- クリップ属性型 ---
  if(!selected||!proj.tracks[selected.ti]||!proj.tracks[selected.ti].clips[selected.ci]){
    setStatus('⚠️ 先にタイムラインでクリップを選んでください（このエフェクトはクリップに付きます）'); return;
  }
  const tr=proj.tracks[selected.ti], c=tr.clips[selected.ci];
  const need=(types,label)=>{
    if(types.includes(tr.type)) return true;
    setStatus('⚠️ '+label+' は'+types.map(t=>({image:'画像',video:'映像',caption:'字幕'}[t]||t)).join('・')+'クリップに使います'); return false;
  };
  if(kind==='zoom-in'){
    if(!need(['image'],'寄り')) return;
    c.motion={zoom:1.06};
    setStatus('🔍 寄りを付けました（1.06）。1本の動画で1〜2枚まで＝全部に付けると酔います');
  } else if(kind==='zoom-out'){
    if(!need(['image'],'引き')) return;
    c.motion={zoom:0.94};
    setStatus('🔭 引きを付けました（0.94）。状況を見せる導入の1枚に');
  } else if(kind==='round'){
    if(!need(['image','video'],'角丸・円')) return;
    c.radius=(c.radius>=0.999)?0:1;
    setStatus(c.radius?'⭕ 円にしました（インスペクタの「角丸」で角丸にも調整できます）':'角丸を解除しました');
  } else if(kind==='pop'){
    if(!need(['caption'],'スタンプ登場')) return;
    if(c.anim==='pop'){ delete c.anim; setStatus('スタンプ登場を解除しました'); }
    else { c.anim='pop'; setStatus('💥 スタンプ登場を付けました。ドーン系の効果音と同時に置くと効きます'); }
  } else if(kind==='fade-in'){
    if(!need(['image','video'],'フェードイン')) return;
    if(c.fadeIn){ delete c.fadeIn; setStatus('フェードインを解除しました'); }
    else { c.fadeIn=0.5; setStatus('🌅 フェードイン 0.5秒。インスペクタの「フェード」で長さを調整できます'); }
  } else if(kind==='fade-out'){
    if(!need(['image','video'],'フェードアウト')) return;
    if(c.fadeOut){ delete c.fadeOut; setStatus('フェードアウトを解除しました'); }
    else { c.fadeOut=0.5; setStatus('🌇 フェードアウト 0.5秒。インスペクタの「フェード」で長さを調整できます'); }
  } else if(kind==='xfade'){
    // クロスフェード: 同一トラックの重なりは鉄則で禁止のため、
    // 選択クリップを「前のクリップより前面の空きトラック」へ移し、0.5秒重ねてフェードインさせる
    if(!need(['image','video'],'クロスフェード')) return;
    const D=0.5;
    const prev=tr.clips.filter(o=>o!==c && o.end<=c.start+1e-3)
                       .sort((a,b)=>b.end-a.end)[0];
    if(!prev || Math.abs(prev.end-c.start)>0.05){
      setStatus('⚠️ クロスフェードは「同じトラックで直前に隣接するクリップ」が必要です（隙間があるならフェードインを使ってください）'); return;
    }
    const st=round(c.start-D), en=c.end, myTi=selected.ti;
    // 前面（index が小さい）側で、区間 [st,en] が空いている同種トラックを探す
    let dst=null;
    for(let i=0;i<myTi;i++){ const t2=proj.tracks[i];
      if(t2.type!==tr.type||t2.hidden) continue;
      if(!t2.clips.some(o=>o.start<en-1e-6 && o.end>st+1e-6)){ dst=t2; break; } }
    if(!dst){ dst={id:'xf'+Date.now(),type:tr.type,label:(tr.type==='image'?'🖼':'🎬')+' クロスフェード',clips:[]};
      proj.tracks.splice(myTi,0,dst); }
    tr.clips.splice(selected.ci,1);
    c.start=st; c.fadeIn=D;
    dst.clips.push(c); dst.clips.sort((a,b)=>a.start-b.start);
    selected={ti:proj.tracks.indexOf(dst),ci:dst.clips.indexOf(c)};
    setStatus('🔀 クロスフェード 0.5秒（前面トラックへ移動して重ねました）。元に戻すには ⌘Z');
  }
  pushHistory(); build();
}

// ---- 音量メーター（ステレオ）＋リミッター ----
let meterOn=false, audioCtx=null, limiterNode=null, anL=null, anR=null, meterRaf=null;
let meterBuf=null, holdL=0, holdR=0, clipUntil=0;
function limiterConf(){
  proj.audio=proj.audio||{};
  proj.audio.limiter=proj.audio.limiter||{on:false,db:-3};
  return proj.audio.limiter;
}
function applyLimiter(){
  if(!limiterNode) return;
  const l=limiterConf();
  limiterNode.threshold.value=l.on?l.db:0;  // OFF時はしきい値0dB=実質バイパス
}
function ensureAudioGraph(){
  // 要素ごとGainNode→マスター(リミッター)→出力＋アナライザ の共通バス。
  // （旧実装は削除済みの #preview 1要素を前提にしておりメーターが完全に死んでいた）
  if(audioCtx) return;
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  limiterNode=audioCtx.createDynamicsCompressor();
  limiterNode.ratio.value=20; limiterNode.knee.value=0;       // ブリックウォール的に
  limiterNode.attack.value=0.003; limiterNode.release.value=0.25;
  const sp=audioCtx.createChannelSplitter(2);
  anL=audioCtx.createAnalyser(); anR=audioCtx.createAnalyser();
  anL.fftSize=2048; anR.fftSize=2048;
  limiterNode.connect(audioCtx.destination);
  limiterNode.connect(sp);
  sp.connect(anL,0); sp.connect(anR,1);
  meterBuf=new Float32Array(2048);
  applyLimiter();
  for(const s in videoEls) attachAudio(videoEls[s]);   // 既存要素をバスへ編入
  for(const k in audioEls) attachAudio(audioEls[k]);
}
function attachAudio(el){
  // 要素の音声をWebAudioバスへ（gain>1・リミッター・メーターを効かせる）。1要素1回しか作れない
  if(!audioCtx||el._gainNode) return;
  try{
    const src=audioCtx.createMediaElementSource(el);
    el._gainNode=audioCtx.createGain();
    src.connect(el._gainNode); el._gainNode.connect(limiterNode);
  }catch(_){}
}
function setElGain(el,g){
  // 書き出し(ffmpeg volume=gain)とプレビューの音量を一致させる。バス接続済みならgain>1も効く
  if(el._gainNode){ el._gainNode.gain.value=g; el.volume=1; }
  else el.volume=Math.max(0,Math.min(1,g));  // グラフ未初期化時のフォールバック（gain>1は1に頭打ち）
}
function chPeak(an){
  an.getFloatTimeDomainData(meterBuf);
  let p=0;
  for(let i=0;i<meterBuf.length;i++){ const a=Math.abs(meterBuf[i]); if(a>p)p=a; }
  return p;
}
function dbPct(p){ const db=p>1e-5?20*Math.log10(p):-60; return Math.max(0,Math.min(100,(db+60)/60*100)); }
function meterTick(){
  if(!meterOn) return;
  const pL=chPeak(anL), pR=chPeak(anR);
  const cL=dbPct(pL), cR=dbPct(pR);
  holdL=Math.max(cL,holdL-0.6); holdR=Math.max(cR,holdR-0.6);  // ピークホールド（緩やかに降下）
  $('mcoverL').style.height=(100-cL)+'%'; $('mcoverR').style.height=(100-cR)+'%';
  $('mpeakL').style.bottom=holdL+'%';    $('mpeakR').style.bottom=holdR+'%';
  if(pL>=0.99||pR>=0.99) clipUntil=performance.now()+1500;     // 0dBFS=クリップ検出（1.5秒点灯）
  $('mclip').classList.toggle('on',performance.now()<clipUntil);
  meterRaf=requestAnimationFrame(meterTick);
}
$('meterBtn').addEventListener('click',()=>{
  meterOn=!meterOn;
  $('meterBtn').classList.toggle('snap-on',meterOn);
  $('meterPanel').style.display=meterOn?'flex':'none';
  if(meterOn){
    ensureAudioGraph(); audioCtx.resume();
    const l=limiterConf();
    $('limOn').checked=!!l.on; $('limDb').value=l.db; $('limLbl').textContent=l.db+'dB';
    holdL=holdR=0; meterTick();
  } else if(meterRaf) cancelAnimationFrame(meterRaf);
});

load();
</script>
