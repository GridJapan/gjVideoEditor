<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GJ VIDEO EDITOR</title>
<style>
  :root{--gpt:#78cdf5;--me:#ffd64c;--vid:#34d399;--bg:#15171c;--panel:#1e2129;--line:#2c303a;--accent:#3b82f6;}
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{margin:0;font-family:-apple-system,"Hiragino Kaku Gothic ProN",system-ui,sans-serif;background:var(--bg);color:#e6e8ec;display:flex;flex-direction:column;height:100vh;}
  header{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-shrink:0;}
  header h1{font-size:15px;margin:0;font-weight:600;cursor:pointer;user-select:none;
    padding:3px 7px;border-radius:8px;border:1px solid transparent;}
  header h1:hover{background:#1b1f2a;border-color:#3a4152;}
  /* ── ビューア（オーバーレイ）: エディタの上に重ねるので、閉じれば編集状態はそのまま ── */
  #viewer{position:fixed;inset:0;z-index:9500;background:#0f1116;display:none;
    flex-direction:column;}
  #viewer.on{display:flex;}
  .vwhead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-shrink:0;}
  .vwhead h2{font-size:15px;margin:0;font-weight:600;color:#e6e8ec;}
  .vwhead select{background:#12141a;border:1px solid var(--line);color:#fff;border-radius:8px;
    padding:6px 9px;font-size:13px;max-width:280px;}
  .vwhead button{font-size:12px;padding:6px 10px;white-space:nowrap;}
  .vwhead .sp{flex:1;}
  .vwbody{flex:1;display:flex;min-height:0;}
  /* 左: サムネイル一覧 */
  #vwlist{width:250px;flex:0 0 250px;overflow-y:auto;border-right:1px solid var(--line);padding:8px;}
  #vwlist::-webkit-scrollbar{width:9px;} #vwlist::-webkit-scrollbar-thumb{background:#3a4150;border-radius:5px;}
  .vwitem{display:block;width:100%;text-align:left;background:#171a20;border:1px solid var(--line);
    border-radius:9px;padding:6px;margin-bottom:8px;cursor:pointer;}
  .vwitem:hover{background:#1e2330;border-color:#3a4152;}
  .vwitem.cur{background:#2b3f6b;border-color:#3b82f6;}
  .vwitem img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#0b0d12;border-radius:6px;display:block;}
  .vwitem .nm{font-size:11px;color:#cfd4de;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .vwitem .mt{font-size:10px;color:#6b7280;font-variant-numeric:tabular-nums;}
  /* 右: プレイヤー */
  #vwmain{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-width:0;padding:14px;gap:10px;}
  #vwvideo{max-width:100%;max-height:calc(100vh - 150px);background:#000;border-radius:10px;display:block;}
  .vwctrl{display:flex;align-items:center;gap:10px;font-size:12px;color:#8a90a0;}
  .vwctrl #vwLoop.on{background:#2b3f6b;border-color:#3b82f6;color:#cfe0ff;}
  .vwempty{color:#6b7280;font-size:13px;}
  /* 長いステータス文でヘッダーが崩れないように: ボタンとタイトルは縮ませず、文だけ「…」で省略する */
  header h1,header button{flex-shrink:0;white-space:nowrap;}
  header .sp{flex:1;}
  #status{font-size:12px;color:#8a90a0;flex:1 1 auto;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  button{background:#2b2f3a;color:#e6e8ec;border:1px solid var(--line);border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px;}
  button:hover{background:#343947;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  button.primary:disabled{opacity:.5;cursor:default;}
  .zoom{display:flex;align-items:center;gap:6px;font-size:12px;color:#8a90a0;}
  .zoom button{padding:3px 9px;}
  .zoom input[type=range]{width:100px;accent-color:var(--accent);vertical-align:middle;}
  .zoom #zoomLbl{min-width:52px;display:inline-block;text-align:right;font-variant-numeric:tabular-nums;}
  /* 上下の高さ調整バー（.pv-resize の横向き版）: ドラッグでプレビューを縮めてタイムラインを広げる */
  .tl-resize{position:relative;height:12px;flex-shrink:0;cursor:ns-resize;z-index:6;
    display:flex;align-items:center;justify-content:center;transition:background .12s;
    background:#252b38;}
  .tl-resize:hover,.tl-resize.drag{background:#333c4e;}
  .tl-resize::before{content:"";height:5px;width:56px;border-radius:3px;background:#5c6678;transition:background .12s,width .12s;}
  .tl-resize:hover::before,.tl-resize.drag::before{background:var(--accent);width:88px;}
  .tlbar{display:flex;align-items:center;gap:10px;padding:5px 16px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);background:#171a20;flex-shrink:0;}
  /* 画面が狭くてもボタン内で文字を折り返さない（「＋ クリッ／プ」になるのを防ぐ）。
     ⚠️ .tlbar に overflow を付けないこと — ドロップダウンが切れる */
  .tlbar > button,.tlbar > .menu-wrap > button{flex-shrink:0;white-space:nowrap;}
  /* アイコンだけのボタン（undo/redo等）: 文字用のpaddingだと横長になるので正方形に寄せる */
  .icobtn{display:inline-flex;align-items:center;justify-content:center;padding:0;width:36px;height:36px;}
  .icobtn svg{width:17px;height:17px;display:block;}
  .tlbar-sp{flex:1;}
  #snapBtn{font-size:12px;padding:5px 11px;}
  #snapBtn.snap-on{background:#2b3f6b;border-color:#3b82f6;color:#cfe0ff;}
  /* 自動保存トグル（ヘッダーの「保存」の隣＝ファイル操作のまとまりに置く） */
  #autoSaveBtn{font-size:12px;padding:7px 11px;align-self:stretch;}
  #autoSaveBtn.snap-on{background:#2b3f6b;border-color:#3b82f6;color:#cfe0ff;}
  /* OFF中に未保存の変更があるとき（保存し忘れを目立たせる） */
  #autoSaveBtn.dirty{background:#5a3a1c;border-color:#e0912f;color:#ffd9a8;}

  .top{display:flex;gap:16px;padding:12px 16px;flex-shrink:0;align-items:flex-start;}
  .preview{width:300px;flex-shrink:0;position:relative;}
  /* 幅調整バー: 通常時もうっすら見えるように（透明だと気づけない）。ホバーでさらに明るく */
  .pv-resize{position:absolute;top:0;right:-15px;width:12px;height:100%;cursor:ew-resize;z-index:6;display:flex;align-items:center;justify-content:center;border-radius:6px;transition:background .12s;
    background:#252b38;}
  .pv-resize:hover,.pv-resize.drag{background:#333c4e;}
  .pv-resize::before{content:"";width:5px;height:56px;border-radius:3px;background:#5c6678;transition:background .12s,height .12s;}
  .pv-resize:hover::before,.pv-resize.drag::before{background:var(--accent);height:88px;}
  /* キャンバス範囲＝チェッカーボード（映像/画像の外側=書き出しでは背景色が分かるように） */
  .stage{position:relative;width:100%;aspect-ratio:1/1;border-radius:10px 10px 0 0;overflow:hidden;
    background-color:#14161b;
    background-image:linear-gradient(45deg,#1f232b 25%,transparent 25%,transparent 75%,#1f232b 75%),
                     linear-gradient(45deg,#1f232b 25%,transparent 25%,transparent 75%,#1f232b 75%);
    background-size:22px 22px;background-position:0 0,11px 11px;}
  #stagewrap{position:absolute;inset:0;transform-origin:center center;transition:transform .08s ease;}
  /* 映像は「外枠(vwrap)＋中身(video)」の2層。レンダラの crop→目標幅へフィット→配置 と同じ意味にする。
     外枠=表示box（crop後の見え）／中身=元映像を拡大してcrop分を外へ押し出す */
  .vwrap{position:absolute;overflow:hidden;background:transparent;}
  .vwrap video{position:absolute;left:0;top:0;width:100%;height:auto;background:transparent;display:block;}
  /* z-indexを付けない=重ね合わせコンテキストを作らない → 各要素のz(トラック順)がstage全体で効く */
  .capov{position:absolute;inset:0;pointer-events:none;}
  /* 字幕PNG（レンダラと同一実装をサーバに描かせたもの）。ステージ全面・当たり判定なし */
  .cappng{position:absolute;inset:0;pointer-events:none;background-size:100% 100%;background-repeat:no-repeat;}
  /* トリミング（クロップ）オーバーレイ: 選択中の映像クリップに枠＋ハンドル */
  .cropov{position:absolute;inset:0;z-index:9000;pointer-events:none;}  /* 編集UIは常に最前面 */
  .cropov .crect{position:absolute;border:1.5px solid var(--accent);box-shadow:0 0 0 9999px rgba(0,0,0,0.45);pointer-events:none;}
  .cropov .ch{position:absolute;width:14px;height:14px;pointer-events:auto;z-index:5;}
  .cropov .ch::after{content:"";position:absolute;inset:3px;background:var(--accent);border:1px solid #fff;border-radius:2px;}
  .cropov .ch.e-l,.cropov .ch.e-r{cursor:ew-resize;} .cropov .ch.e-t,.cropov .ch.e-b{cursor:ns-resize;}
  .cropov .ch.c-tl,.cropov .ch.c-br{cursor:nwse-resize;} .cropov .ch.c-tr,.cropov .ch.c-bl{cursor:nesw-resize;}
  .capitem{position:absolute;display:flex;flex-direction:column;overflow:hidden;line-height:1.55;pointer-events:auto;cursor:grab;user-select:none;}
  .capitem .cap-line{width:100%;}
  .capitem span{border-radius:6px;white-space:pre-wrap;-webkit-box-decoration-break:clone;box-decoration-break:clone;}
  .capitem.sel{outline:1.5px dashed var(--accent);outline-offset:1px;}
  .capitem.sel::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;background:var(--accent);border-radius:3px 0 0 0;cursor:nwse-resize;}
  /* 選択中クリップの操作ハンドル（プレビュー上で直感的に触るためのもの）。
     画像/映像に共通。枠自体は当たり判定を持たず、ハンドルだけが掴める */
  #selbox{position:absolute;z-index:9200;pointer-events:none;display:none;
    border:1px solid var(--accent);box-sizing:border-box;}
  #selbox.on{display:block;}
  #selbox .h{position:absolute;pointer-events:auto;}
  /* 右下＝サイズ */
  #selbox .h-size{right:-7px;bottom:-7px;width:14px;height:14px;background:var(--accent);
    border:2px solid #fff;border-radius:3px;cursor:nwse-resize;}
  /* 上中央＝回転 */
  #selbox .h-rot{left:50%;top:-30px;margin-left:-8px;width:16px;height:16px;background:#fff;
    border:2px solid var(--accent);border-radius:50%;cursor:grab;}
  #selbox .h-rot::after{content:'';position:absolute;left:50%;top:14px;width:2px;height:16px;
    margin-left:-1px;background:var(--accent);}
  /* 左上＝角丸（内側へドラッグすると丸くなる） */
  #selbox .h-rad{left:6px;top:6px;width:12px;height:12px;background:#fff;
    border:2px solid var(--accent);border-radius:50%;cursor:nwse-resize;}
  #selbox .hint{position:absolute;left:50%;top:-52px;transform:translateX(-50%);
    background:#1b1f2a;border:1px solid #3a4152;border-radius:6px;padding:2px 7px;
    font-size:11px;color:#cfd4de;white-space:nowrap;display:none;}
  .guide{position:absolute;background:var(--accent);opacity:.85;z-index:9001;pointer-events:none;display:none;}
  #guideV{top:0;bottom:0;width:1px;left:50%;}
  #guideH{left:0;right:0;height:1px;top:50%;}
  .insp-row{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:12px;color:#8a90a0;flex-wrap:wrap;}
  .insp-row select,.insp-row input[type=number]{background:#12141a;border:1px solid var(--line);color:#e6e8ec;border-radius:6px;padding:5px 7px;font-size:12.5px;font-family:inherit;}
  .insp-row input[type=number]{width:64px;}
  .alignseg button{padding:5px 9px;font-size:12px;}
  .alignseg button.on{background:#2b3f6b;border-color:var(--accent);color:#cfe0ff;}
  .pvctrl{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;background:var(--panel);border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:7px 10px;}
  .pvctrl button{padding:4px 10px;font-size:14px;}
  .pvctrl #tlabel{font-size:11px;color:#8a90a0;font-variant-numeric:tabular-nums;white-space:nowrap;}
  /* シークバーは残り幅に合わせて縮む（min-widthを大きく取ると次行へ回り込む） */
  .pvctrl input[type=range]{flex:1 1 40px;min-width:0;accent-color:var(--accent);}
  /* ループ再生トグル（シークバーの右）。プレビュー列は300px前後しかないのでアイコンのみ。
     文字を入れると次の行へ回り込む。ON/OFFは色で示す（吸着ボタンと同じ配色） */
  #loopBtn{font-size:13px;padding:3px 6px;flex:0 0 auto;line-height:1;opacity:.5;}
  #loopBtn.on{background:#2b3f6b;border-color:#3b82f6;opacity:1;}
  .pvzoom{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:11px;color:#8a90a0;}
  .pvzoom button{padding:2px 9px;font-size:13px;line-height:1;}
  .pvzoom .pvzlbl{min-width:40px;text-align:center;font-variant-numeric:tabular-nums;color:#cfd4de;}
  /* 書き出しサイズ（右端の余白へ）。狭い時は縮んで「…」になり、行を折り返さない。クリックで変更 */
  .pvzoom .pvsize{margin-left:auto;font-variant-numeric:tabular-nums;color:#8a90a0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;
    border:1px solid transparent;border-radius:6px;padding:1px 6px;}
  .pvzoom .pvsize:hover{color:#cfd4de;border-color:#3a4152;background:#1b1f2a;}
  /* 書き出しサイズの変更ポップアップ */
  .szpop{position:fixed;z-index:99999;background:#1b1f2a;border:1px solid #3a4152;border-radius:10px;
    padding:10px;box-shadow:0 10px 28px #000c;width:236px;font-size:12px;color:#cfd4de;}
  .szpop .szitem{display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:7px 9px;border-radius:6px;cursor:pointer;}
  .szitem:hover{background:#2b3350;}
  .szitem.cur{background:#2b3f6b;}
  .szitem b{font-weight:600;}
  .szitem span{color:#8a90a0;font-variant-numeric:tabular-nums;}
  .szpop .szlabel{font-size:10px;color:#6b7280;margin:8px 0 4px;border-top:1px solid #262b38;padding-top:8px;}
  .szpop .szrow{display:flex;align-items:center;gap:6px;}
  .szpop .szrow input{width:62px;background:#12141a;border:1px solid var(--line);color:#fff;
    border-radius:6px;padding:4px 6px;font-size:12px;}
  .szpop .szchk{display:flex;align-items:center;gap:6px;margin-top:9px;font-size:11px;color:#8a90a0;cursor:pointer;}
  .szpop .szapply{width:100%;margin-top:9px;padding:6px;font-size:12px;}
  .pvhint{font-size:11px;color:#6b7280;margin-top:5px;}

  .insp-col{flex:1;display:flex;flex-direction:column;min-width:0;gap:8px;}
  /* 現在のプロジェクト名（プロパティエリア上・一行・中央揃え） */
  /* 下のプロパティエリア(--panel)と区別するため、濃いネイビー地＋アクセントの左右線 */
  #projLabel{flex:0 0 auto;text-align:center;font-size:13px;font-weight:600;color:#dbe4f0;
    background:#141a24;border:1px solid #2f3a4d;border-left:3px solid var(--accent);
    border-radius:8px;padding:7px 10px;letter-spacing:.02em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .inspector{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;min-width:0;overflow-y:auto;}
  .inspector::-webkit-scrollbar{width:9px;} .inspector::-webkit-scrollbar-thumb{background:#3a4150;border-radius:5px;} .inspector::-webkit-scrollbar-track{background:transparent;}
  .inspector.empty{display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:13px;}
  .insp-head{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
  .swatch{width:22px;height:22px;border-radius:50%;border:2px solid #0006;padding:0;cursor:pointer;opacity:.7;}
  .swatch.cur{border-color:#fff;opacity:1;}
  .swatch:hover{opacity:1;}
  .insp-time{font-size:12px;color:#8a90a0;font-variant-numeric:tabular-nums;}
  .insp-title{font-size:13px;color:#cfd4de;font-weight:600;}
  .inspector textarea{width:100%;height:70px;background:#12141a;border:1px solid var(--line);color:#fff;border-radius:8px;padding:10px;font-size:15px;resize:vertical;font-family:inherit;}
  /* 強調ツールバー（字幕テキスト欄の上）: 文字を選択→★強調で色付け。記法を手で書かせない */
  .captools{display:flex;align-items:center;gap:8px;margin:0 0 6px;}
  .captools .caphint{font-size:11px;color:#8a93a6;}
  .captools .embtn{height:26px;padding:0 10px;width:auto;min-width:0;white-space:nowrap;}
  .captools .embtn b{color:#d6ad5c;font-size:12px;}
  .insp-del{margin-top:8px;color:#e8543f;background:none;border:1px solid #40252260;}
  .insp-note{font-size:12px;color:#8a90a0;line-height:1.6;}
  /* 字幕装飾インスペクタ */
  .insp-grid{display:flex;flex-direction:column;margin-top:4px;}
  /* 項目ごとに区切り線（ごちゃつき防止）。最終行は線なし */
  .frow2{display:flex;align-items:center;gap:8px;font-size:12px;color:#8a90a0;flex-wrap:wrap;
    padding:8px 0;border-bottom:1px solid #232836;}
  .frow2:last-child{border-bottom:none;}
  /* ラベルは折り返さない。最長は「タイムライン」「トリミング」の6文字＝12px×6+余白
     （56pxだと2行になっていた。縦は余裕があるので、本当に長いものだけ意図的に折り返す） */
  .frow2>.flabel{width:80px;flex-shrink:0;color:#8a90a0;white-space:nowrap;}
  .swrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;}
  .sw{width:20px;height:20px;border-radius:50%;border:2px solid #0006;padding:0;cursor:pointer;opacity:.65;}
  .sw.cur{border-color:#fff;opacity:1;}
  .sw:hover{opacity:1;}
  /* 現在色の●（クリックでパレットを開く） */
  .swcur{width:24px;height:24px;border-radius:50%;border:2px solid #454c5e;padding:0;cursor:pointer;}
  .swcur:hover{border-color:#8a90a0;}
  /* 色パレットのポップアップ: 自由指定 → 標準色 → お気に入り */
  .swpop{position:fixed;z-index:99999;background:#1b1f2a;border:1px solid #3a4152;border-radius:10px;
    padding:10px 12px;box-shadow:0 10px 28px #000c;width:198px;}
  .swpop .sphead{display:flex;gap:6px;align-items:center;margin-bottom:2px;}
  .swpop .splabel{font-size:10px;color:#6b7280;margin:8px 0 4px;border-top:1px solid #262b38;padding-top:7px;}
  .swpop .sprow{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .swpop .pick{position:relative;width:24px;height:24px;border-radius:50%;border:2px solid #454c5e;overflow:hidden;cursor:pointer;flex:0 0 auto;}
  .swpop .pick input{position:absolute;inset:-6px;width:40px;height:40px;padding:0;border:0;cursor:pointer;}
  .swpop .hex{width:74px;}
  .swpop .fav{background:none;border:none;color:#f0cf94;font-size:15px;cursor:pointer;padding:0 3px;}
  .iconbtn{width:30px;height:28px;display:inline-flex;align-items:center;justify-content:center;padding:0;
    background:#2b2f3a;border:1px solid var(--line);border-radius:7px;cursor:pointer;color:#cfd4de;font-size:15px;}
  .iconbtn:hover{background:#343947;}
  .iconbtn.on{background:#2b3f6b;border-color:var(--accent);color:#cfe0ff;}
  .iconbtn svg{width:16px;height:16px;display:block;}
  .iconbtn b{font-weight:800;} .iconbtn i{font-style:italic;} .iconbtn u{text-decoration:underline;} .iconbtn s{text-decoration:line-through;}
  .iconrow{display:flex;gap:5px;}
  .iconrow.gap{margin-left:8px;}
  .numin{width:44px;background:#12141a;border:1px solid var(--line);color:#fff;border-radius:6px;padding:3px 5px;font-size:12px;}
  .toggle{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;}
  /* スライダーは固定幅（flex:1だとウルトラワイドで果てしなく伸びる） */
  .frow2 input[type=range]{flex:0 0 auto;width:150px;accent-color:var(--accent);}
  .inspector input[type=range]{width:150px;max-width:150px;}

  #tlrow{flex:1;display:flex;min-height:0;}
  /* 左：トラックラベル列（固定幅・縦スクロールは右ペインと同期） */
  #trackLabels{width:104px;flex:0 0 104px;overflow:hidden;position:relative;background:#12141a;border-top:1px solid var(--line);border-right:1px solid #20242e;}
  /* ラベル列ヘッダ＝現在時刻（分:秒:1/100秒）。プレイヘッドに追従 */
  #trackLabelsHead{position:absolute;top:0;left:0;right:0;height:22px;background:#12141a;border-bottom:1px solid var(--line);z-index:2;
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#cfd8e8;
    font-variant-numeric:tabular-nums;letter-spacing:.04em;}
  #trackLabelsInner{position:absolute;top:22px;left:0;right:0;}
  .tlabel{box-sizing:border-box;border-bottom:1px solid #1c202a;padding:3px 4px 3px 6px;display:flex;flex-direction:column;justify-content:center;gap:3px;position:relative;overflow:hidden;}
  .tlabel .tlrow1{display:flex;align-items:center;gap:4px;}
  .thandle{cursor:grab;color:#5a6172;font-size:12px;line-height:1;user-select:none;padding:0 1px;}
  .thandle:hover{color:#9aa1b2;}
  .tlname{font-size:11px;color:#9aa1b2;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  /* トラック種別バッジ（カスタム名でも何のトラックか一目で分かるように） */
  .ttype{font-size:9px;font-weight:700;line-height:1;padding:2px 4px;border-radius:3px;flex:0 0 auto;
    background:#2c3444;color:#9fb0c8;}
  .ttype.ty-image{background:#24365a;color:#9ec5ff;}
  .ttype.ty-caption{background:#383250;color:#c9b8ff;}
  .ttype.ty-video{background:#1f4438;color:#7fe3bd;}
  .ttype.ty-audio{background:#3d3320;color:#f0cf94;}
  .ttype.ty-mask{background:#4a3520;color:#ffc08a;}
  .tlctrls{display:flex;align-items:center;gap:3px;}
  .tlbtn{width:22px;height:20px;display:inline-flex;align-items:center;justify-content:center;padding:0;background:#20242e;border:1px solid var(--line);border-radius:5px;cursor:pointer;color:#9aa1b2;font-size:12px;line-height:1;}
  .tlbtn:hover{background:#2b3350;color:#cfd4de;}
  .tlbtn.off{color:#e8543f;border-color:#5a2a25;}
  .tldel{cursor:pointer;color:#5a6172;font-size:12px;line-height:1;padding:0 2px;border-radius:3px;}
  .tldel:hover{color:#e8543f;background:#e8543f22;}
  .tlabel.dragging{opacity:.4;}
  .tlabel.drop-above{box-shadow:inset 0 2px 0 var(--accent);}
  .tlabel.drop-below{box-shadow:inset 0 -2px 0 var(--accent);}
  .tlwrap{flex:1;overflow:auto;border-top:1px solid var(--line);background:#0f1116;position:relative;}
  #meterPanel{width:92px;flex-shrink:0;border-top:1px solid var(--line);border-left:1px solid var(--line);background:#12141a;display:flex;flex-direction:column;padding:10px;gap:8px;}
  .meter-bars{flex:1;display:flex;gap:10px;justify-content:center;min-height:60px;}
  .mcol{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;}
  .mcol>span{font-size:10px;color:#6b7280;}
  .mbar{position:relative;width:16px;flex:1;border-radius:3px;overflow:hidden;
    background:linear-gradient(to top,#22c55e 0%,#22c55e 58%,#eab308 72%,#ef4444 86%,#ef4444 100%);}
  .mcover{position:absolute;left:0;right:0;top:0;height:100%;background:#0b0d12;}
  .mpeak{position:absolute;left:0;right:0;height:2px;background:#fff;bottom:0;opacity:.85;}
  .mclip{font-size:10px;text-align:center;color:#5a6172;font-weight:700;border:1px solid var(--line);border-radius:4px;padding:2px 0;letter-spacing:1px;}
  .mclip.on{color:#fff;background:#ef4444;border-color:#ef4444;}
  .mlim{font-size:10.5px;color:#8a90a0;display:flex;flex-direction:column;gap:3px;}
  .mlim input[type=range]{width:100%;accent-color:var(--accent);}
  .mlim label{display:flex;align-items:center;gap:4px;cursor:pointer;}
  #meterBtn.snap-on{background:#2b3f6b;border-color:#3b82f6;color:#cfe0ff;}
  .timeline{position:relative;min-height:200px;}
  .ruler{position:sticky;top:0;height:22px;background:#0f1116;border-bottom:1px solid var(--line);z-index:3;}
  .tick{position:absolute;top:0;height:22px;border-left:1px solid #2a2e38;padding-left:4px;font-size:10px;color:#6b7280;line-height:22px;}
  .tick.major{border-left-color:#3a4150;color:#9aa1b2;}
  .tick.minor{top:15px;height:7px;padding-left:0;border-left-color:#262b35;}
  .lane{position:relative;border-bottom:1px solid #1c202a;}
  .lane.hidden-track .lane-body{opacity:.35;}
  .menu-wrap{position:relative;display:inline-block;}
  .menu{position:absolute;top:calc(100% + 4px);left:0;background:#1e2129;border:1px solid var(--line);border-radius:8px;padding:4px;z-index:60;min-width:150px;box-shadow:0 6px 20px #0008;}
  /* 項目名は折り返さない（メニュー幅が中身に合わせて広がる。min-widthで2行になると読みにくい） */
  .menu button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 10px;border-radius:6px;font-size:13px;white-space:nowrap;}
  .menu button:hover{background:#2b3350;}
  /* エフェクトのライブラリ: カテゴリ見出し＋説明つき（階層は1段まで。多段ネストは小規模では不要） */
  .fxmenu{min-width:250px;padding:6px;}
  .fxcat{font-size:10px;color:#6b7280;padding:8px 10px 4px;border-top:1px solid #262b38;margin-top:4px;}
  .fxcat:first-child{border-top:none;margin-top:0;padding-top:4px;}
  .fxmenu button{padding:7px 10px;line-height:1.35;}
  .fxnote{display:block;font-size:10px;color:#6b7280;margin-top:1px;}
  .fxmenu button:hover .fxnote{color:#9aa1b2;}
  .tlwrap.dragover{outline:2px dashed var(--accent);outline-offset:-4px;background:#12203a;}
  /* ドロップ先として確定しているレーンを強調（種別が一致するレーンのみ光る） */
  .lane.drop-target{background:#16325a;box-shadow:inset 0 0 0 2px var(--accent);}
  /* 縦の縮尺: --vscale（トラックラベル領域のホイールで変更）。レーン/クリップ/波形が連動して伸縮 */
  .lane-body{position:relative;}
  .lane.video .lane-body{height:calc(52px*var(--vscale,1));}
  .lane.caption .lane-body{height:calc(60px*var(--vscale,1));}
  .lane.audio-wave .lane-body{height:calc(44px*var(--vscale,1));}
  .wave{position:absolute;top:calc(5px*var(--vscale,1));height:calc(34px*var(--vscale,1));background:#12203a;background-size:100% 100%;background-repeat:no-repeat;border-radius:4px;border:1px solid #2f4570;}
  .clip{position:absolute;top:calc(6px*var(--vscale,1));border-radius:7px;overflow:hidden;cursor:grab;user-select:none;box-shadow:0 1px 3px #0006;border:1px solid #3a4560;}
  .clip.video{height:calc(40px*var(--vscale,1));background:#1f3b34;border-color:#2f5d50;border-left:4px solid var(--vid);}
  .clip.caption{height:calc(48px*var(--vscale,1));}
  .clip.image{height:calc(34px*var(--vscale,1));background:#33244a;border-color:#4b3570;border-left:4px solid #a78bfa;}
  .lane.image .lane-body{height:calc(46px*var(--vscale,1));}
  .clip.mask{height:calc(34px*var(--vscale,1));background:#3a2f14;border-color:#6b5320;border-left:4px solid #ffb020;}
  .lane.mask .lane-body{height:calc(46px*var(--vscale,1));}
  .clip.audio{height:calc(38px*var(--vscale,1));background:#241f38 center/100% 100% no-repeat;border-color:#4b3570;border-left:4px solid #8b6fd0;}
  .lane.audio .lane-body{height:calc(48px*var(--vscale,1));}
  .masklayer{position:absolute;inset:0;pointer-events:none;}
  .maskbox{position:absolute;pointer-events:auto;cursor:grab;user-select:none;box-sizing:border-box;}
  .maskbox.hide{backdrop-filter:blur(9px);background:rgba(20,20,25,0.25);border:1.5px dashed #ffb020;}
  .maskbox.hide.solid{backdrop-filter:none;background:#000;}
  .maskbox.show{border:2px solid #3b82f6;box-shadow:0 0 0 9999px rgba(0,0,0,0.5);background:transparent;}
  .maskbox.sel{outline:2px solid var(--accent);outline-offset:1px;}
  .maskbox .mlabel{position:absolute;top:2px;left:4px;font-size:10px;color:#ffd08a;background:#0009;padding:1px 4px;border-radius:3px;pointer-events:none;white-space:nowrap;}
  .maskbox .mrs{position:absolute;right:-6px;bottom:-6px;width:14px;height:14px;background:var(--accent);border:1px solid #fff;border-radius:3px;cursor:nwse-resize;}
  .ovlayer{position:absolute;inset:0;pointer-events:none;}
  .ovimg{position:absolute;pointer-events:auto;cursor:grab;user-select:none;outline:1px dashed #ffffff44;}
  .ovimg.sel{outline:2px solid var(--accent);}
  .clip.sel{outline:2px solid var(--accent);z-index:6;}
  /* ドラッグ中の着地点プレビュー（残像）。移動先レーンの落ちる位置に半透明で出す */
  .clip.clip-ghost{opacity:.5;border:2px dashed var(--accent);box-shadow:0 0 0 1px var(--accent) inset;
    background:rgba(90,140,240,0.16);pointer-events:none;z-index:8;}
  .clip.clip-ghost .lbl{color:#dfe6f2;}
  /* 重なりNG（赤）: 青の代わりに赤で「ここには置けない・離すとキャンセル」を示す */
  .lane.drop-bad{background:#3a1620;box-shadow:inset 0 0 0 2px #e5484d;}
  .clip.clip-ghost.bad{border-color:#e5484d;box-shadow:0 0 0 1px #e5484d inset;background:rgba(229,72,77,0.18);}
  .clip.clip-bad{outline:2px solid #e5484d;box-shadow:0 0 0 9999px rgba(229,72,77,0.04);}
  .clip .lbl{padding:5px 8px;font-size:11px;color:#cfd4de;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none;}
  .clip .fade{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;overflow:hidden;}
  .clip .fade svg{width:100%;height:100%;display:block;}
  .clip .h{position:absolute;top:0;width:9px;height:100%;cursor:ew-resize;}
  .clip .h.l{left:0;} .clip .h.r{right:0;}
  .playhead{position:absolute;top:0;width:2px;background:#e8543f;z-index:50;pointer-events:none;box-shadow:0 0 0 0.5px #e8543f88;}
  /* 掴み用ハンドル: 見た目の細線の上に幅広の当たり判定。ヘッドの▽つまみも表示 */
  .playhead .ph-grab{position:absolute;left:-7px;top:0;width:16px;height:100%;cursor:grab;pointer-events:auto;}
  .playhead.drag .ph-grab{cursor:grabbing;}
  .playhead .ph-knob{position:absolute;left:-6px;top:0;width:14px;height:11px;background:#e8543f;border-radius:0 0 3px 3px;pointer-events:none;box-shadow:0 1px 2px #0007;}
  .playhead.drag{width:2px;background:#ff6b52;}
  .selrange{position:absolute;top:0;height:100%;background:#e8543f30;border-left:1px solid #e8543f;border-right:1px solid #e8543f;z-index:7;pointer-events:none;}
  .cutmark{position:absolute;top:22px;bottom:0;background:#e8543f22;border-left:2px solid #e8543f;border-right:2px solid #e8543f;z-index:7;cursor:pointer;}
  .cutmark span{position:absolute;top:2px;left:50%;transform:translateX(-50%);font-size:11px;color:#e8543f;}

  /* ヘッダ: 保存系とzip(共有)系を視覚的に分ける区切り */
  .hgap{width:1px;height:18px;background:var(--line);margin:0 4px;}
  /* プロジェクト一覧（ファイルを探させず、一覧から選ぶ） */
  .plist{max-height:52vh;overflow:auto;margin:-4px -4px 12px;}
  .pcard{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;border:1px solid transparent;}
  .pcard:hover{background:#1a1d25;border-color:var(--line);}
  .pcard.cur{background:#1e2a45;border-color:var(--accent);}
  .pcard .pth{width:44px;height:44px;border-radius:6px;background:#0e1015;border:1px solid var(--line);flex:0 0 auto;
              display:flex;align-items:center;justify-content:center;font-size:17px;color:#5a6070;}
  .pcard .pnm{font-size:13px;font-weight:600;color:#e6e8ec;}
  .pcard .pmeta{font-size:11px;color:#8a90a0;margin-top:2px;}
  .pcard .pbadge{margin-left:auto;font-size:10px;color:var(--accent);}
  /* カラーピッカー: 8色固定の◯だけでなく、任意色とお気に入りを持てるようにする */
  .swrow{display:flex;align-items:center;gap:5px;flex-wrap:wrap;}
  .swrow .pick{width:20px;height:20px;padding:0;border-radius:50%;overflow:hidden;border:1px solid var(--line);cursor:pointer;position:relative;}
  .swrow .pick input{position:absolute;inset:-6px;width:32px;height:32px;border:none;padding:0;background:none;cursor:pointer;}
  .swrow .hex{width:78px;font-size:11px;text-transform:uppercase;}
  .swrow .fav{font-size:12px;padding:2px 6px;}
  .swrow .sep{width:1px;height:16px;background:var(--line);margin:0 2px;}
  .modal-bg{position:fixed;inset:0;background:#000a;z-index:100;display:flex;align-items:center;justify-content:center;}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;width:480px;box-shadow:0 10px 40px #000c;}
  .modal h2{font-size:15px;margin:0 0 14px;font-weight:600;}
  .frow{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;}
  .frow>label{width:52px;color:#8a90a0;flex-shrink:0;}
  .seg{display:flex;gap:6px;flex-wrap:wrap;}
  .seg button{padding:6px 12px;font-size:12.5px;}
  .seg button.on{background:#2b3f6b;border-color:var(--accent);color:#cfe0ff;}
  .exp-note{font-size:11.5px;color:#8a90a0;line-height:1.6;margin:2px 0 14px;min-height:32px;}
  .exp-path{font-size:11px;color:#6b7280;margin:-6px 0 12px 62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .exp-result{background:#12141a;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:12px;font-size:12.5px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .exp-result a{color:#7fb2ff;}
  .exp-actions{display:flex;gap:8px;justify-content:flex-end;}
</style>
</head>
<body>
<header>
  <h1 id="logoBtn" title="クリックでビューア（書き出した動画をさくっと見る）">🎬 GJ VIDEO EDITOR</h1>
  <button id="newBtn">✨ 新規</button>
  <button id="openBtn">📂 開く</button>
  <button id="saveBtn">💾 保存</button>
  <button id="autoSaveBtn" class="snap-on" title="編集するたび自動でディスクに保存します。OFFにすると「保存」を押すまで書き込みません">自動保存 ON</button>
  <span class="hgap"></span>
  <button id="zipOutBtn" title="共有用zipを書き出し（他の人に渡す）">📦 zip書き出し</button>
  <button id="zipInBtn" title="共有用zipを読み込み（受け取ったzipを開く）">📥 zip読み込み</button>
  <input type="file" id="projZip" accept=".zip" style="display:none">
  <span id="status"></span>
  <span class="sp"></span>
  <button class="primary" id="renderBtn">📤 書き出し</button>
</header>

<!-- ビューア: 書き出した動画をさくっと見るためのオーバーレイ。
     エディタの上に重ねるだけなので、閉じれば編集状態（再生位置・選択）はそのまま残る -->
<div id="viewer">
  <div class="vwhead">
    <h2 id="vwLogo" title="エディタに戻る" style="cursor:pointer;user-select:none;">🎞 GJ VIDEO VIEWER</h2>
    <select id="vwScope"></select>
    <button id="vwPickDir" title="任意のフォルダを選ぶ（デスクトップや書き出し先など）">📁 フォルダを選ぶ…</button>
    <span id="vwCount" class="mt" style="font-size:11px;color:#6b7280;"></span>
    <span class="sp"></span>
    <button id="vwClose" title="閉じる (Esc)">✕ 閉じる</button>
  </div>
  <div class="vwbody">
    <div id="vwlist"></div>
    <div id="vwmain">
      <video id="vwvideo" controls playsinline></video>
      <div class="vwctrl">
        <span id="vwTitle">—</span>
        <button id="vwLoop" title="ループ再生">🔁 ループ</button>
      </div>
    </div>
  </div>
</div>

<!-- プロジェクト一覧: OSのファイルダイアログでjsonを探させず、一覧から選ばせる -->
<div class="modal-bg" id="openBg" style="display:none">
  <div class="modal">
    <h2>📂 プロジェクトを開く</h2>
    <div class="plist" id="plist"></div>
    <div class="exp-actions">
      <button id="openFileBtn" title="projects/ の外にあるプロジェクトを開く">別の場所から選ぶ…</button>
      <button id="openCancel">閉じる</button>
    </div>
  </div>
</div>
<!-- 新規作成: 既存プロジェクトの「型」を継承できる（トラック構成・ロゴ/帯/背景/BGM） -->
<div class="modal-bg" id="newBg" style="display:none">
  <div class="modal">
    <h2>✨ 新しいプロジェクト</h2>
    <div class="frow"><label>名前</label>
      <input type="text" id="newName" class="numin" style="width:260px" placeholder="例: my-video-01">
    </div>
    <div class="frow"><label>型を引き継ぐ</label>
      <select id="newTpl" class="numin" style="width:260px"></select>
    </div>
    <div class="frow" id="newSizeRow"><label>サイズ</label>
      <div class="seg" id="newSize">
        <button data-v="1080x1920" class="on">縦 1080×1920</button>
        <button data-v="1920x1080">横 1920×1080</button>
        <button data-v="1080x1080">正方 1080×1080</button>
      </div>
    </div>
    <div class="exp-result" id="newNote">既存プロジェクトの型を選ぶと、トラック構成・ロゴ・帯・背景・BGM・効果音を引き継ぎます（中身は空）。</div>
    <div class="exp-actions">
      <button id="newCancel">閉じる</button>
      <button class="primary" id="newGo">作成</button>
    </div>
  </div>
</div>
<div class="modal-bg" id="expBg" style="display:none">
  <div class="modal">
    <h2>📤 書き出し</h2>
    <div class="frow"><label>形式</label>
      <div class="seg" id="expFmt">
        <button data-v="mp4" class="on">MP4</button>
        <button data-v="webm">WebM</button>
        <button data-v="gif">GIF</button>
        <button data-v="mp3">MP3（音声のみ）</button>
      </div>
    </div>
    <div class="frow"><label>画質</label>
      <div class="seg" id="expQ">
        <button data-v="high">高</button>
        <button data-v="std" class="on">標準</button>
        <button data-v="light">軽量</button>
      </div>
    </div>
    <div class="frow" id="expHRow"><label>解像度（短辺）</label>
      <div class="seg" id="expH">
        <button data-v="" class="on">元のまま</button>
        <button data-v="1080">1080</button>
        <button data-v="720">720</button>
        <button data-v="480">480</button>
      </div>
    </div>
    <div class="frow"><label>書き出し先</label>
      <div class="seg" id="expDest">
        <button data-v="download" class="on">📁 ダウンロードフォルダ</button>
        <button data-v="folder" id="expDirBtn">📁 フォルダを指定…</button>
      </div>
    </div>
    <div class="exp-path" id="expDestPath"></div>
    <div class="exp-note" id="expNote"></div>
    <div class="exp-result" id="expResult" style="display:none"></div>
    <div class="exp-actions">
      <button id="expCancel">閉じる</button>
      <button class="primary" id="expGo">書き出す</button>
    </div>
  </div>
</div>

<div class="top">
  <div>
    <div class="preview" id="previewBox">
      <div class="stage">
        <div id="stagewrap">
          <div class="ovlayer" id="ovlayer"></div>
          <div class="masklayer" id="masklayer"></div>
          <div class="capov" id="capov"></div>
          <div class="cropov" id="cropov" style="display:none"></div>
          <!-- 選択中クリップの操作ハンドル（サイズ・回転・角丸） -->
          <div id="selbox">
            <div class="hint" id="selHint"></div>
            <div class="h h-rot" id="hRot" title="ドラッグで回転（Shiftで15°刻み）"></div>
            <div class="h h-size" id="hSize" title="ドラッグでサイズ変更"></div>
            <div class="h h-rad" id="hRad" title="内側へドラッグで角丸"></div>
          </div>
          <div class="guide" id="guideV"></div>
          <div class="guide" id="guideH"></div>
        </div>
      </div>
      <div class="pvctrl">
        <button id="toStartBtn" title="先頭へ (Home)">⏮</button>
        <button id="playBtn">▶</button>
        <span id="tlabel">0:00 / 0:00</span>
        <input type="range" id="seek" min="0" max="100" step="0.05" value="0">
        <button id="loopBtn" title="ループ再生">🔁</button>
      </div>
      <div class="pv-resize" id="pvResize" title="ドラッグで幅を変更"></div>
    </div>

<script>
let proj=null, scale=80, selected=null;   // selected={ti,ci}
let LOADED_PROJ='';  // この画面が読み込んだプロジェクト名。保存時に送り、サーバ側の切替を検知する
let LOADED_VER='';   // 読み込んだproject.jsonの版(mtime)。保存時に照合し、他所の更新を潰さない
let playTime=0, playing=false, rafId=null, lastTs=0;
let selection=null;
let snapEnabled=true;
// ループ再生（終端＝一番右端のクリップの終わりまで来たら先頭へ戻る）。ショート動画の繋ぎ目確認用
let loopEnabled=(localStorage.getItem('ve_loop')==='on');
let history=[], histIndex=-1, clipboard=null, saveTimer=null;
const $=id=>document.getElementById(id);
// 旧形式(speaker参照)の字幕を汎用形式へ変換: text="ラベル｜本文" / color=話者色 / speaker削除
function migrateCaptions(){
  const spks=(proj.style&&proj.style.speakers)||{};
  proj.tracks.forEach(tr=>{
    if(tr.type!=='caption') return;
    tr.clips.forEach(c=>{
      if(c.speaker==null) return;
      const sp=spks[c.speaker];
      if(sp){ c.text=(sp.label?sp.label+'｜':'')+c.text; c.color=(sp.color||[255,255,255]).slice(); }
      delete c.speaker;
    });
  });
}

function realDur(){
  let d=0;
  proj.tracks.forEach(tr=>tr.clips.forEach(c=>{ if(c.end>d) d=c.end; }));
  return d;
}
// ---- カット区間（cuts）: タイムラインは元の時間軸のまま、再生時だけ飛ばす（書き出しと尺を一致させる） ----
// tがカット内なら、そのカットを返す
function cutAt(t){
  const cs=proj.cuts||[];
  for(const c of cs){ if(t>=c.start&&t<c.end) return c; }
  return null;
}
// カット合計秒
function cutsTotal(){ return (proj.cuts||[]).reduce((a,c)=>a+Math.max(0,c.end-c.start),0); }
// 書き出し後の実効尺（カット後）
function outDur(){ return Math.max(0, realDur()-cutsTotal()); }
// 元の時間t → 書き出し後の時間（tより前のカット分を差し引く）
function outTimeOf(t){
  let acc=0;
  for(const c of (proj.cuts||[])){
    if(c.end<=t) acc+=c.end-c.start;
    else if(c.start<t) acc+=t-c.start;
  }
  return Math.max(0,t-acc);
}
// カット内に居たら区間の終わりへ飛ばす。飛ばしたらtrue
function skipCut(){
  const c=cutAt(playTime);
  if(!c) return false;
  playTime=c.end;
  return true;
}
function duration(){ return realDur()+2; }
function round(v){ return Math.round(v*100)/100; }
// ---- 映像クリッププール（同一トラックに複数の映像オブジェクト対応） ----
// 映像は**クリップ単位**で<video>要素を持つ（キー "ti-ci"）。
// srcキーだと同一ソースをin=参照する複数クリップ（ジャンプカット・メイン＋ワイプ）が要素を共有し、
// 2つ同時に映せない＝書き出しと食い違う。レンダラは全映像クリップをz順に重ねる。
let videoEls={};   // "ti-ci" -> <video>要素
let videoDur={};   // src -> ソース尺(秒)  ※尺はソース固有なのでsrcキーのまま
function vTrack(){ return proj.tracks.find(t=>t.type==='video'); }
// 非表示トラックは除外。前面（配列先頭）優先で最後に評価されるよう配列末尾→先頭で上書き
function vClips(){ let out=[]; proj.tracks.forEach(t=>{ if(t.type==='video'&&!t.hidden) out=out.concat(t.clips); }); return out; }
function vTrackOf(c){ return proj.tracks.find(t=>t.type==='video'&&t.clips.includes(c)); }
// playTime時点でアクティブな映像クリップ（上のトラック＝前面を優先）。単一選択が要るUI用
function activeVClip(t){
  let r=null, rank=-1;
  proj.tracks.forEach((tr,ti)=>{ if(tr.type!=='video'||tr.hidden) return;
    tr.clips.forEach(c=>{ if(t>=c.start && t<c.end){ if(r===null || ti<=rank){ r=c; rank=ti; } } }); });
  return r;
}
// playTime時点でアクティブな全映像クリップ（レンダラと同じく重ねて出すため）
function activeVClips(t){
  const out=[];
  proj.tracks.forEach((tr,ti)=>{ if(tr.type!=='video'||tr.hidden) return;
    tr.clips.forEach((c,ci)=>{ if(t>=c.start && t<c.end) out.push({c,ti,ci,key:ti+'-'+ci}); }); });
  return out;
}
function vKeyOf(c){  // クリップ → 要素キー
  let k=null;
  proj.tracks.forEach((tr,ti)=>{ if(tr.type!=='video') return;
    tr.clips.forEach((cc,ci)=>{ if(cc===c) k=ti+'-'+ci; }); });
  return k;
}
function vElOf(c){ const k=vKeyOf(c); return k?videoEls[k]:null; }
function ensureVideoEls(){
  const stage=document.getElementById('stagewrap')||document.querySelector('.stage'); if(!stage) return;
  const want=new Map();   // key -> src
  proj.tracks.forEach((tr,ti)=>{ if(tr.type!=='video'||tr.hidden) return;
    tr.clips.forEach((c,ci)=>{ if(c.src) want.set(ti+'-'+ci, c.src); });
  });
  for(const k in videoEls){  // 不要になった要素を破棄（外枠ごと）
    if(!want.has(k) || !videoEls[k].dataset.src || videoEls[k].dataset.src!==want.get(k)){
      (videoEls[k]._wrap||videoEls[k]).remove(); delete videoEls[k];
    }
  }
  const stillUsed=new Set(want.values());
  for(const s in videoDur){ if(!stillUsed.has(s)) delete videoDur[s]; }
  want.forEach((src,k)=>{
    if(videoEls[k]) return;
    const wrap=document.createElement('div'); wrap.className='vwrap'; wrap.style.visibility='hidden';
    const v=document.createElement('video'); v.playsInline=true; v.preload='auto';
    v.className='pvvideo'; v.dataset.src=src;
    v.src='/src?name='+encodeURIComponent(src)+'&t='+Date.now();
    v.addEventListener('loadedmetadata',()=>{
      if(isFinite(v.duration)&&v.duration>0){ videoDur[src]=v.duration; }
      syncVideoToTime();          // 実寸(videoWidth/Height)が判ってからcropレイアウトを確定させる
      if(!playing) build();
    });
    wrap.appendChild(v); stage.insertBefore(wrap, stage.firstChild);
    v._wrap=wrap; wrap._video=v;
    videoEls[k]=v; attachAudio(v);
  });
}
function pauseAllV(){ for(const s in videoEls){ if(!videoEls[s].paused) videoEls[s].pause(); } }
// ---- 効果音/BGMのプレビュー再生（音声トラックのクリップを再生時に鳴らす） ----
let audioEls={};   // "ti-ci" -> <audio>要素
function ensureAudioEls(){
  const want=new Set();
  proj.tracks.forEach((tr,ti)=>{ if(tr.type!=='audio') return;
    tr.clips.forEach((c,ci)=>{ if(!c.src) return; const key=ti+'-'+ci; want.add(key);
      if(!audioEls[key]){ const a=new Audio(); a.preload='auto'; a.src=assetUrl(c.src); audioEls[key]=a; attachAudio(a); }
      else if(!audioEls[key].src.includes(encodeURIComponent(c.src))){ audioEls[key].src=assetUrl(c.src); }
    });
  });
  for(const k in audioEls){ if(!want.has(k)){ audioEls[k].pause(); delete audioEls[k]; } }
}
function pauseAllA(){ for(const k in audioEls){ if(!audioEls[k].paused) audioEls[k].pause(); } }
// 再生中のみ、各音声クリップを playTime に合わせて鳴らす（スクラブ中は鳴らさない）
// 開始時に1回だけシークし、以降は自然再生に任せる（毎フレーム再シークするとplaybackを邪魔して無音になる）
function syncAudioToTime(){
  if(!playing){ pauseAllA(); return; }
  proj.tracks.forEach((tr,ti)=>{
    if(tr.type!=='audio') return;
    const muted=!!tr.muted;
    tr.clips.forEach((c,ci)=>{
      const a=audioEls[ti+'-'+ci]; if(!a) return;
      const active=playTime>=c.start && playTime<c.end;
      if(active && !muted){
        setElGain(a,(c.gain==null?1:c.gain));
        if(a.paused && !a._starting){   // クリップに入った瞬間、シーク完了を待ってから頭出し再生
          const target=Math.max(0,(c.in||0)+(playTime-c.start));
          a._starting=true;
          const go=()=>{ a._starting=false; if(playing) a.play().catch(()=>{}); };
          const seekThenPlay=()=>{
            if(Math.abs(a.currentTime-target)>0.05){ a.addEventListener('seeked',go,{once:true}); try{a.currentTime=target;}catch(_){ go(); } }
            else go();
          };
          if(a.readyState>=1) seekThenPlay();
          else a.addEventListener('loadedmetadata',seekThenPlay,{once:true});
        }
      } else if(!a.paused || a._starting){ a._starting=false; if(!a.paused) a.pause(); }
    });
  });
}
function srcDurOf(src){ return videoDur[src]||realDur(); }
// 波形divを、映像クリップの配置とトリム(in/長さ)に合わせて表示。波形PNGはソース全体なので該当区間だけ切り出す。
function styleWave(el,c){
  const sd=srcDurOf(c.src);
  const inn=c.in||0, dur=Math.max(0.01,c.end-c.start);
  const cw=Math.max(6,dur*scale);
  el.style.left=(c.start*scale)+'px';
  el.style.width=cw+'px';
  const fw=sd>0?Math.min(1,dur/sd):1;
  const fs=sd>0?Math.min(1,inn/sd):0;
  const bgW=cw/(fw>0?fw:1);
  el.style.backgroundSize=bgW+'px 100%';
  el.style.backgroundPosition=(-(fs*bgW))+'px 0';
}
function snap(t){
  if(!snapEnabled) return round(t);
  const thresh=9/scale;
  let best=t, bd=thresh;
  const pts=[0, realDur(), playTime, Math.round(t)];
  proj.tracks.forEach(tr=>tr.clips.forEach(c=>{ pts.push(c.start, c.end); }));
  for(const p of pts){ const d=Math.abs(p-t); if(d<bd){ bd=d; best=p; } }
  return round(best);
}
function fmt(t){ return t.toFixed(2)+'s'; }
function fmtT(s){ s=Math.max(0,s); const m=Math.floor(s/60); const ss=Math.floor(s%60); return m+':'+(ss<10?'0':'')+ss; }
function isSel(ti,ci){ return selected&&selected.ti===ti&&selected.ci===ci; }
// 選択中の映像クリップ（なければ先頭）を返す
function selVideoClip(){
  if(selected){ const tr=proj.tracks[selected.ti]; if(tr&&tr.type==='video') return {vt:tr,v:tr.clips[selected.ci]}; }
  const vt=proj.tracks.find(t=>t.type==='video'); return vt&&vt.clips[0]?{vt,v:vt.clips[0]}:null;
}
function detachAudio(){
  const sel=selVideoClip(); if(!sel) return;
  const {vt,v}=sel; v.audioLinked=false;
  let at=proj.tracks.find(t=>t.type==='audio'&&t.label==='🔊 元音声');
  if(!at){ at={id:'vaudio'+Date.now(),type:'audio',label:'🔊 元音声',clips:[]}; proj.tracks.splice(proj.tracks.indexOf(vt)+1,0,at); }
  at.clips.push({src:v.src,start:v.start,end:v.end,in:(v.in||0),gain:1,fromVideo:true});
  selected={ti:proj.tracks.indexOf(at),ci:at.clips.length-1};
  pushHistory(); build(); setStatus('🔗 音声を分離しました（独立して編集できます）');
}
function relinkAudio(){
  const sel=selVideoClip(); if(!sel) return;
  sel.v.audioLinked=true;
  const at=proj.tracks.find(t=>t.type==='audio'&&t.label==='🔊 元音声');
  if(at){ at.clips=at.clips.filter(c=>c.src!==sel.v.src); if(!at.clips.length) proj.tracks.splice(proj.tracks.indexOf(at),1); }
  selected={ti:proj.tracks.indexOf(sel.vt),ci:sel.vt.clips.indexOf(sel.v)};
  pushHistory(); build(); setStatus('🔗 音声を映像に再リンクしました');
}

// z-order導入に伴う一度きりの移行: 「上＝前面」ルールに合わせ、旧データ(映像が先頭=背景前提)を
// 前面→背面の順 [画像, 字幕, 音声, 映像] へ並べ替える（映像を最下段=背面に）。
function migrateTrackOrder(){
  if(proj._zorder) return false;
  proj._zorder=1;
  const by=t=>proj.tracks.filter(x=>x.type===t);
  const ordered=[...by('image'),...by('caption'),...by('mask'),...by('audio'),...by('video')];
  const next=ordered.concat(proj.tracks.filter(t=>!ordered.includes(t)));  // 未知型も落とさない
  const changed=next.some((t,i)=>t!==proj.tracks[i]);
  proj.tracks=next;
  return changed;
}
// 素材のキャッシュバスター: load()のたびに更新する。
// 同名で素材を差し替えると（fx_lines.pngの再生成・音声の作り直し等）ブラウザが古い絵/音を掴み続けるため。
// 映像(/src)は元から付けている。ここは画像・音声用。毎フレーム変わる値にはしないこと（再取得が走り続ける）
let ASSET_V=Date.now();
function assetUrl(name){ return '/asset?name='+encodeURIComponent(name)+'&v='+ASSET_V; }
async function load(){
  const pr=await fetch('/api/project');
  LOADED_VER=pr.headers.get('X-Project-Version')||'';   // この版を基準に保存時照合する
  ASSET_V=Date.now();                                    // 開き直し＝素材も取り直す
  proj=await pr.json();
  migrateCaptions();
  const zmig=migrateTrackOrder();
  ensureVideoEls();
  seekTo(0);
  build();
  refreshProjLabel();      // 現在のプロジェクト名をプロパティエリア上に表示
  if(zmig) await save();   // 並べ替え移行を永続化
  history=[snapshot()]; histIndex=0;
}

// 同一トラック内のクリップ重なり判定。
// ドラッグ・ペースト・複製・外部ファイルドロップの**全経路**がこれを通ること。
// （以前はドラッグだけが重なりを禁止し、⌘D/⌘V/ドロップは素通りしていたため、
//  複製したクリップが必ず元と重なり、その後ドラッグしても常に赤で戻される詰み状態になった）
function overlapsIn(clips, cc){
  return clips.some(o=>o!==cc && cc.start<o.end-1e-6 && cc.end>o.start+1e-6);
}
// start に長さ len で置こうとして重なるなら、ぶつかったクリップの直後へ順に送る。
// 置ける開始時刻を返す（ignore は自分自身＝移動中のクリップ）
function findFreeStart(clips, start, len, ignore){
  const others=clips.filter(o=>o!==ignore).slice().sort((a,b)=>a.start-b.start);
  let s=round(start);
  for(let guard=0; guard<=others.length; guard++){
    const hit=others.find(o=> s < o.end-1e-6 && (s+len) > o.start+1e-6 );
    if(!hit) return s;
    s=round(hit.end);
  }
  return s;
}

// #lanes の子は proj.tracks と 1:1 ではない。
// 映像トラックの直後に波形レーン(.audio-wave)を差し込むため、children[ti] は下のトラックほどズレる。
// レーン/クリップを引くときは必ず data-ti を使うこと（index で引くと別トラックを掴む）
function laneBodyFor(ti){
  const lane=$('lanes').querySelector('.lane[data-ti="'+ti+'"]:not([data-type="audiowave"])');
  return lane ? lane.querySelector('.lane-body') : null;
}
function clipElFor(ti,ci){
  const body=laneBodyFor(ti);
  return body ? body.children[ci] : null;
}
// クリップ上のフェード山型を描き直す。build() 全体を回さずに済ませるための部品
// （インスペクタごと作り直すと入力欄がフォーカスごと消えるため。issue: フェード秒が打てない）
function applyFadeSvg(el,c){
  const old=el.querySelector('.fade'); if(old) old.remove();
  if(!(c.fadeIn||c.fadeOut)) return;
  const cw=Math.max(6,(c.end-c.start)*scale), dur=Math.max(0.01,c.end-c.start), H=40;
  const inx=Math.min(cw*0.5,(c.fadeIn||0)/dur*cw), outx=Math.min(cw*0.5,(c.fadeOut||0)/dur*cw);
  // 山型ライン: 冒頭は下→上へ立ち上がり、末尾は上→下へ落ちる。両端の暗い三角＝フェード区間
  const ramp='0,'+H+' '+inx+',0 '+(cw-outx)+',0 '+cw+','+H;
  let svg='<svg viewBox="0 0 '+cw+' '+H+'" preserveAspectRatio="none">';
  if(c.fadeIn)  svg+='<polygon points="0,0 '+inx+',0 0,'+H+'" fill="rgba(0,0,0,0.5)"/>';
  if(c.fadeOut) svg+='<polygon points="'+(cw-outx)+',0 '+cw+',0 '+cw+','+H+'" fill="rgba(0,0,0,0.5)"/>';
  svg+='<polyline points="'+ramp+'" fill="none" stroke="#ffd64c" stroke-width="1.5"/></svg>';
  const fd=document.createElement('div'); fd.className='fade'; fd.innerHTML=svg;
  el.appendChild(fd);
}
function renderFades(ti,ci){
  const el=clipElFor(ti,ci); if(!el) return;
  applyFadeSvg(el, proj.tracks[ti].clips[ci]);
}

function build(){
  ensureVideoEls(); ensureAudioEls();
  const stg=document.querySelector('.stage');
  if(stg&&proj.canvas) stg.style.aspectRatio=(proj.canvas.w||1)+' / '+(proj.canvas.h||1);  // 出力比に合わせる
  if(stg){  // 出力背景色(canvas.bg)をプレビューにも反映。未指定/透過ならチェッカー柄
    const bg=proj.canvas&&proj.canvas.bg;
    stg.style.background = (bg && bg!=='transparent' && bg!=='none') ? bg : '';
  }
  // 幅は「尺×縮尺」だが、**表示領域より狭くしない**。
  // 縮小すると右側が空白になり、目盛り・時刻・レーンの帯が消えたように見えるため（2026-07-17指摘）
  const dur=duration();
  const wrapW=($('tlwrap').clientWidth||0)-2;   // 枠線ぶん
  const W=Math.max(dur*scale, wrapW);
  $('timeline').style.width=W+'px';
  $('zoomLbl').textContent=Math.round(scale)+'px/s';
  $('zoomSlider').value=Math.round(scale);

  const ruler=$('ruler'); ruler.innerHTML=''; ruler.style.width=W+'px';
  // 縮尺で刻みを可変に。広く見るとき=副目盛り1秒、拡大すると0.5s・0.25s。主目盛り(ラベル)は間隔をあける。
  const minorStep = scale>=300?0.25:(scale>=150?0.5:1);
  const majorStep = scale<45?20:(scale<90?10:(scale<200?5:(scale<340?2:1)));
  // 尺でなく実幅ぶん引く（右端まで目盛りを届かせる）。
  // floorにすること — ceilだと最後の目盛りが幅をはみ出して横スクロールバーが出る
  const n=Math.floor((W/scale)/minorStep);
  for(let i=0;i<=n;i++){
    const t=i*minorStep;
    const isMajor=Math.abs(t/majorStep-Math.round(t/majorStep))<1e-6;
    const k=document.createElement('div'); k.className='tick '+(isMajor?'major':'minor');
    k.style.left=(t*scale)+'px';
    if(isMajor) k.textContent=(Math.round(t*100)/100)+'s';
    ruler.appendChild(k);
  }

  const lanes=$('lanes'); lanes.innerHTML='';
  const laneMeta=[];  // {ti, kind:'main'|'audiowave', lane}
  proj.tracks.forEach((tr,ti)=>{
    const lane=document.createElement('div'); lane.className='lane '+tr.type+(tr.hidden?' hidden-track':'');
    lane.dataset.ti=ti; lane.dataset.type=tr.type;   // ドロップ先のトラック特定に使う
    const body=document.createElement('div'); body.className='lane-body'; body.style.width=W+'px';
    tr.clips.forEach((c,ci)=>{
      const el=document.createElement('div');
      el.className='clip '+tr.type+(isSel(ti,ci)?' sel':'');
      if(tr.type==='caption'){
        const col=(c.color||[154,161,178]).join(',');  // 色未設定はニュートラル
        el.style.borderLeft='4px solid rgb('+col+')';
        el.style.background='rgba('+col+',0.16)';
      }
      el.style.left=(c.start*scale)+'px';
      el.style.width=Math.max(6,(c.end-c.start)*scale)+'px';
      if(tr.type==='audio'&&c.src){
        if(c.fromVideo){ el.style.backgroundImage="url('/waveform')"; styleWave(el,c); }
        else{ el.style.backgroundImage="url('/waveform?name="+encodeURIComponent(c.src)+"')"; }
      }
      const lbl=document.createElement('div'); lbl.className='lbl';
      lbl.textContent = tr.type==='caption'
        ? c.text
        : (tr.type==='image' ? '🖼 '+(c.src||'')
          : (tr.type==='audio' ? '🎵 '+(c.src||'')
            : (tr.type==='mask' ? (c.mode==='show'?'🔦 表示':(c.style==='solid'?'⬛ 黒塗り':c.style==='blur'?'🌫 ぼかし':'🟫 モザイク')) : '🎬 '+(c.src||tr.type))));
      el.appendChild(lbl);
      if(tr.type==='video') applyFadeSvg(el,c);
      const hl=document.createElement('div'); hl.className='h l'; el.appendChild(hl);
      const hr=document.createElement('div'); hr.className='h r'; el.appendChild(hr);
      attachDrag(el,hl,hr,ti,ci);
      body.appendChild(el);
    });
    lane.appendChild(body);
    lanes.appendChild(lane);
    laneMeta.push({ti, kind:'main', lane});
    if(tr.type==='video' && tr.clips.some(c=>c.audioLinked!==false)){
      const alane=document.createElement('div'); alane.className='lane audio-wave';
      alane.dataset.ti=ti; alane.dataset.type='audiowave';   // 映像に紐づく波形表示。ドロップ先にはしない
      const abody=document.createElement('div'); abody.className='lane-body'; abody.style.width=W+'px';
      tr.clips.forEach((c,ci)=>{
        if(c.audioLinked===false) return;  // 分離済みクリップは元音声を出さない
        const el=document.createElement('div'); el.className='wave'; el.dataset.wi=ci;
        el.style.backgroundImage="url('/waveform?name="+encodeURIComponent(c.src)+"')";
        styleWave(el,c);
        abody.appendChild(el);
      });
      alane.appendChild(abody); lanes.appendChild(alane);
      laneMeta.push({ti, kind:'audiowave', lane:alane});
    }
  });

  buildTrackLabels(laneMeta);
  $('playhead').style.height=$('timeline').offsetHeight+'px';
  renderImages(); renderMasks(); renderCuts();
  syncPlayhead(); updateCap(); updateImageVis(); updateCtrl(); renderInspector();
  renderCropOverlay(); syncInspectorHeight(); refreshCanvasLabel(); syncSelBox();
}

// トラック名の先頭にある装飾絵文字を表示上だけ落とす（ミュート/非表示のアイコンボタンと混ざるため）

// 左ペインのトラックラベル（各レーンと高さを揃える）。表示/非表示・ミュート・削除・並べ替え。

      mute.addEventListener('click',ev=>{ ev.stopPropagation(); tr.muted=!tr.muted; pushHistory(); build(); });
      r1.append(nm,mute); row.appendChild(r1);

    }
    // メインレーンのラベル

    attachTrackReorder(handle,row,m.ti);
    // 種別バッジ（カスタム名を付けても何のトラックか分かるように常に出す）＋任意の名前
    const TYPE_JA={video:'映像',caption:'字幕',image:'画像',audio:'音声',mask:'マスク'};

    ty.textContent=tyName; ty.title=tyName+'トラック';
    const nm=document.createElement('span'); nm.className='tlname';
    nm.textContent=stripIcon(tr.label);
    nm.title=(tr.label?tr.label+' / ':'')+tyName+'トラック';
    r1.append(handle,ty,nm);
    if(!(tr.type==='video'&&vcount<=1)){
      const del=document.createElement('span'); del.className='tldel'; del.textContent='✕'; del.title='トラック削除';
      del.addEventListener('click',ev=>{ ev.stopPropagation(); deleteTrack(m.ti); });
      r1.appendChild(del);
    }
    row.appendChild(r1);
    // コントロール行：映像/画像/字幕=表示切替、音声=ミュート
    const ctr=document.createElement('div'); ctr.className='tlctrls';
    if(tr.type==='audio'){
      const mute=document.createElement('button'); mute.className='tlbtn'+(tr.muted?' off':'');
      mute.innerHTML=tr.muted?'🔇':'🔊'; mute.title=tr.muted?'ミュート解除':'ミュート';
      mute.addEventListener('click',ev=>{ ev.stopPropagation(); tr.muted=!tr.muted; pushHistory(); build(); });
      ctr.appendChild(mute);
    } else {
      const vis=document.createElement('button'); vis.className='tlbtn'+(tr.hidden?' off':'');
      vis.innerHTML=tr.hidden?'🚫':'👁'; vis.title=tr.hidden?'表示する':'非表示にする';
      vis.addEventListener('click',ev=>{ ev.stopPropagation(); tr.hidden=!tr.hidden; pushHistory(); build(); });
      ctr.appendChild(vis);

    row.appendChild(ctr);
    inner.appendChild(row);

  syncLabelScroll();
}
function syncLabelScroll(){ $('trackLabelsInner').style.transform='translateY('+(-$('tlwrap').scrollTop)+'px)'; }
// トラックの縦並べ替え（ドラッグ）。z-order（重ね順）も配列順に従う＝上のトラックほど前面。
function attachTrackReorder(handle,row,srcTi){
  handle.addEventListener('pointerdown',ev=>{
    ev.preventDefault(); ev.stopPropagation(); if(playing) return;
    handle.setPointerCapture(ev.pointerId); row.classList.add('dragging');
    const inner=$('trackLabelsInner');
    const clear=()=>inner.querySelectorAll('.tlabel').forEach(r=>r.classList.remove('drop-above','drop-below'));
    let dest=srcTi;
    const mv=e=>{
      clear();
      const mains=[...inner.querySelectorAll('.tlabel')].filter(r=>r.dataset.kind==='main');
      dest=proj.tracks.length;
      for(const r of mains){ const rect=r.getBoundingClientRect();
        if(e.clientY<rect.top+rect.height/2){ dest=+r.dataset.ti; r.classList.add('drop-above'); break; } }
      if(dest===proj.tracks.length && mains.length) mains[mains.length-1].classList.add('drop-below');
    };
    const up=()=>{
      try{handle.releasePointerCapture(ev.pointerId);}catch(_){}
      handle.removeEventListener('pointermove',mv); handle.removeEventListener('pointerup',up);
      row.classList.remove('dragging'); clear(); moveTrack(srcTi,dest);
    };
    handle.addEventListener('pointermove',mv); handle.addEventListener('pointerup',up);
  });
}
function moveTrack(from,to){
  if(to===from||to===from+1){ build(); return; }
  const [t]=proj.tracks.splice(from,1);
  if(to>from) to--;
  to=Math.max(0,Math.min(proj.tracks.length,to));
  proj.tracks.splice(to,0,t);
  selected=null; pushHistory(); build(); setStatus('トラックを並べ替え');
}

// 映像/音声クリップが伸ばせる上限＝start + (ソース長 - 冒頭トリム)。不明ならnull（制限しない）
function srcLimitEnd(c,type){
  let sd=null;
  if(type==='video'){ sd=videoDur[c.src]; }
  else if(type==='audio'){
    for(const k in audioEls){
      const a=audioEls[k];
      if((a.src||'').includes(encodeURIComponent(c.src))&&isFinite(a.duration)&&a.duration>0){ sd=a.duration; break; }
    }
  }
  if(!sd||!isFinite(sd)) return null;
  return c.start + Math.max(0.2, sd-(c.in||0));
}
function attachDrag(el,hl,hr,ti,ci){
  const begin=(mode)=>(ev)=>{
    ev.preventDefault(); ev.stopPropagation();
    const c=proj.tracks[ti].clips[ci];
    const x0=ev.clientX, y0=ev.clientY, s0=c.start, e0=c.end, in0=(c.in||0);
    const srcType=proj.tracks[ti].type;   // 縦移動は同じ種類のトラック間だけ許す
    let moved=false, dropTi=null, ghost=null, bad=false;
    const clearDrop=()=>{ document.querySelectorAll('.lane.drop-target,.lane.drop-bad').forEach(l=>l.classList.remove('drop-target','drop-bad')); };
    const removeGhost=()=>{ if(ghost){ ghost.remove(); ghost=null; } };
    // 同じトラック内で時間が重なる他クリップがあるか（重なり=NG。cc自身は除外）
    const overlaps=overlapsIn;   // 判定は1か所（overlapsIn）に集約
    el.setPointerCapture(ev.pointerId);
    const move=(e)=>{
      const dx=(e.clientX-x0)/scale;
      if(Math.abs(e.clientX-x0)>3||Math.abs(e.clientY-y0)>3) moved=true;
      if(mode==='move'){
        const len=e0-s0; let ns=Math.max(0,snap(s0+dx)); c.start=ns; c.end=round(ns+len);
        // 縦方向: ポインタ下の「同じ種類・別トラック」のレーンを移動先候補にする
        // （el を一時的に pointer 透過にして、クリップの下のレーンを拾う）
        el.style.pointerEvents='none';
        clearDrop(); dropTi=null; bad=false;
        const under=document.elementFromPoint(e.clientX,e.clientY);
        const lane=under&&under.closest?under.closest('.lane[data-type]'):null;
        if(lane&&lane.dataset.type===srcType&&(+lane.dataset.ti)!==ti){
          // 別トラックへ。移動先で既存クリップと時間が重なるなら NG（赤・ドロップ不可）
          dropTi=+lane.dataset.ti;
          bad=overlaps(proj.tracks[dropTi].clips, c);
          lane.classList.add(bad?'drop-bad':'drop-target');
          // 着地点を示すゴースト（残像）を移動先レーンの落ちる位置に出す
          const body=lane.querySelector('.lane-body');
          if(!ghost){
            ghost=document.createElement('div');
            ghost.className='clip '+srcType+' clip-ghost';
            const gl=document.createElement('div'); gl.className='lbl';
            const src=el.querySelector('.lbl'); gl.textContent=src?src.textContent:'';
            ghost.appendChild(gl);
          }
          if(ghost.parentNode!==body) body.appendChild(ghost);
          ghost.classList.toggle('bad',bad);
          ghost.style.left=(c.start*scale)+'px';
          ghost.style.width=Math.max(6,(c.end-c.start)*scale)+'px';
        } else {
          // 同じトラック内の横移動。他クリップと重なる位置は NG（赤・離すと元へ戻す）
          removeGhost();
          bad=overlaps(proj.tracks[ti].clips, c);
        }
        el.classList.toggle('clip-bad', bad && dropTi==null);
      }
      else if(mode==='l'){
        const ns=Math.min(e0-0.2,Math.max(0,snap(s0+dx)));
        c.start=ns;
        const tt=proj.tracks[ti].type;
        if(tt==='video'||tt==='audio') c.in=round(Math.max(0,in0+(ns-s0))); // 冒頭トリム=ソース内オフセット
      }
      else if(mode==='r'){
        let ne=snap(Math.max(s0+0.2,e0+dx));
        // 映像/音声はソース長を超えて伸ばせない（超えても中身が無く、無音＋静止になるだけ）
        const lim=srcLimitEnd(c,proj.tracks[ti].type);
        if(lim!=null&&ne>lim){ ne=round(lim); setStatus('⚠️ 素材の終端です（これ以上は伸ばせません）'); }
        c.end=ne;
      }
      if(mode==='l'||mode==='r'){   // リサイズも隣クリップに食い込ませない（赤＝離すとキャンセル）
        bad=overlaps(proj.tracks[ti].clips,c);
        el.classList.toggle('clip-bad',bad);
      }
      el.style.left=(c.start*scale)+'px';
      el.style.width=Math.max(6,(c.end-c.start)*scale)+'px';
      if(proj.tracks[ti].type==='video'){
        // 文書内の最初の波形レーンではなく、このトラックの波形レーンを引く
        // （映像トラックが2本あると1本目の波形が動いてしまう）
        const wv=document.querySelector('.lane.audio-wave[data-ti="'+ti+'"] .wave[data-wi="'+ci+'"]');
        if(wv) styleWave(wv,c);
      }
    };
    const up=()=>{
      try{ el.releasePointerCapture(ev.pointerId); }catch(_){}
      el.style.pointerEvents=''; clearDrop(); removeGhost(); el.classList.remove('clip-bad');
      el.removeEventListener('pointermove',move);
      el.removeEventListener('pointerup',up);
      if(!moved){ select(ti,ci); }
      else if(bad){
        // 重なる位置には置けない → 掴む前の状態へ戻してキャンセル（移動もリサイズも）
        c.start=s0; c.end=e0; if(c.in!=null) c.in=in0;
        build(); setStatus(mode==='move'?'⚠️ クリップが重なるため移動できません':'⚠️ クリップが重なるためサイズを変えられません');
      }
      else if(mode==='move'&&dropTi!=null){
        // 同じ種類の別トラックへクリップを移す（末尾＝最前面に置く。重なり順は既存ルールと同じ）
        const cl=proj.tracks[ti].clips.splice(ci,1)[0];
        proj.tracks[dropTi].clips.push(cl);
        selected={ti:dropTi,ci:proj.tracks[dropTi].clips.length-1};
        pushHistory(); build(); setStatus('別のトラックへ移動'); seekTo(playTime);
      }
      else { pushHistory(); setStatus('移動'); seekTo(playTime); }
    };
    el.addEventListener('pointermove',move);
    el.addEventListener('pointerup',up);
  };
  el.addEventListener('pointerdown',begin('move'));
  hl.addEventListener('pointerdown',begin('l'));
  hr.addEventListener('pointerdown',begin('r'));
}

function select(ti,ci){ selected={ti,ci}; build(); }

// ---- トリミング（クロップ）をプレビュー上で直接操作。インスペクタ数値と双方向連動 ----
let cropNumInputs=null;  // 映像インスペクタのクロップ数値入力[左,上,右,下]
function renderCropOverlay(){
  const ov=$('cropov'); if(!ov) return;
  ov.innerHTML='';
  const tr=selected&&proj.tracks[selected.ti];
  if(!tr||tr.type!=='video'||!tr.clips[selected.ci]){ ov.style.display='none'; return; }
  ov.style.display='block';
  const rect=document.createElement('div'); rect.className='crect'; ov.appendChild(rect);
  // ワイプ(x/y指定)は 角=拡大縮小 / 辺=トリミング。全画面映像は従来どおり全ハンドルがトリミング
  const isWipe=(tr.clips[selected.ci].x!=null&&tr.clips[selected.ci].y!=null);
  [['c-tl',['L','T']],['c-tr',['R','T']],['c-bl',['L','B']],['c-br',['R','B']],
   ['e-t',['T']],['e-b',['B']],['e-l',['L']],['e-r',['R']]].forEach(([cls,edges])=>{
    const h=document.createElement('div'); h.className='ch '+cls; h.dataset.cls=cls;
    if(isWipe&&edges.length===2){ h.classList.add('scale'); h.title='ドラッグで拡大縮小'; attachWipeScale(h,cls); }
    else { h.title='ドラッグでトリミング'; attachCropDrag(h,edges); }
    ov.appendChild(h);
  });
  positionCropOverlay();
}
function positionCropOverlay(){
  const ov=$('cropov'); if(!ov||ov.style.display==='none'||!selected) return;
  const c=proj.tracks[selected.ti].clips[selected.ci]; const cr=c.crop||[0,0,0,0];
  // 編集枠を映像の実表示box(ワイプなら小窓)に合わせる。全画面前提だと小窓なのに枠が全面に出てしまう
  const _v0=vElOf(c), vel=_v0&&(_v0._wrap||_v0), wrap=document.getElementById('stagewrap');  // 表示boxは外枠
  if(vel&&wrap){
    const vr=vel.getBoundingClientRect(), wr=wrap.getBoundingClientRect();
    if(wr.width>0&&wr.height>0&&vr.width>0){
      ov.style.inset='auto';
      ov.style.left=((vr.left-wr.left)/wr.width*100)+'%';
      ov.style.top=((vr.top-wr.top)/wr.height*100)+'%';
      ov.style.width=(vr.width/wr.width*100)+'%';
      ov.style.height=(vr.height/wr.height*100)+'%';
    }
  }
  const L=cr[0]||0,T=cr[1]||0,R=cr[2]||0,B=cr[3]||0;
  const rect=ov.querySelector('.crect');
  if(rect){ rect.style.left=(L*100)+'%'; rect.style.top=(T*100)+'%'; rect.style.right=(R*100)+'%'; rect.style.bottom=(B*100)+'%'; }

  const pos={'c-tl':[px,py],'c-tr':[pr,py],'c-bl':[px,pb],'c-br':[pr,pb],'e-t':[pcx,py],'e-b':[pcx,pb],'e-l':[px,pcy],'e-r':[pr,pcy]};

// ワイプの角をひっぱって拡大縮小（対角の角を固定＝一般的なPiPの挙動）
function attachWipeScale(h,cls){
  h.addEventListener('pointerdown',ev=>{
    ev.preventDefault(); ev.stopPropagation();
    const c=proj.tracks[selected.ti].clips[selected.ci];
    const wrap=document.getElementById('stagewrap').getBoundingClientRect();
    const _v=vElOf(c); if(!_v) return;
    const v=_v._wrap||_v;   // 表示boxは外枠（crop時、中身のvideoははみ出している）
    const r0=v.getBoundingClientRect();
    const w0=r0.width/wrap.width, h0=r0.height/wrap.height;
    const x0=c.x, y0=c.y, s0=(c.scale==null?1:c.scale);
    const right=x0+w0, bottom=y0+h0;
    h.setPointerCapture(ev.pointerId);
    const mv=e=>{
      const px=(e.clientX-wrap.left)/wrap.width;
      let nw=(cls==='c-br'||cls==='c-tr')?(px-x0):(right-px);
      nw=Math.max(0.05,Math.min(1,nw));
      const ratio=nw/Math.max(0.0001,w0);
      c.scale=round3(Math.max(0.05,s0*ratio));
      const nh=h0*ratio;
      if(cls==='c-bl'||cls==='c-tl') c.x=round3(Math.max(0,right-nw));   // 右端を固定
      if(cls==='c-tr'||cls==='c-tl') c.y=round3(Math.max(0,bottom-nh));  // 下端を固定
      syncVideoToTime(); positionCropOverlay();
    };
    const up=()=>{ try{h.releasePointerCapture(ev.pointerId);}catch(_){}; h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up);
      pushHistory(); setStatus('ワイプ拡大縮小'); renderInspector(); };
    h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
  });
}
function attachCropDrag(h,edges){
  h.addEventListener('pointerdown',ev=>{
    ev.preventDefault(); ev.stopPropagation();
    const c=proj.tracks[selected.ti].clips[selected.ci];
    if(!c.crop) c.crop=[0,0,0,0];
    const st=$('cropov').getBoundingClientRect();
    h.setPointerCapture(ev.pointerId);
    const mv=e=>{
      const fx=Math.max(0,Math.min(1,(e.clientX-st.left)/st.width));
      const fy=Math.max(0,Math.min(1,(e.clientY-st.top)/st.height));
      const cr=c.crop;
      edges.forEach(ed=>{
        if(ed==='L') cr[0]=Math.max(0,Math.min(0.45,Math.min(fx,1-(cr[2]||0)-0.1)));
        if(ed==='R') cr[2]=Math.max(0,Math.min(0.45,Math.min(1-fx,1-(cr[0]||0)-0.1)));
        if(ed==='T') cr[1]=Math.max(0,Math.min(0.45,Math.min(fy,1-(cr[3]||0)-0.1)));
        if(ed==='B') cr[3]=Math.max(0,Math.min(0.45,Math.min(1-fy,1-(cr[1]||0)-0.1)));
      });
      syncVideoToTime(); positionCropOverlay(); syncCropInputs();
    };
    const up=()=>{ try{h.releasePointerCapture(ev.pointerId);}catch(_){}; h.removeEventListener('pointermove',mv); h.removeEventListener('pointerup',up); pushHistory(); setStatus('トリミング'); };
    h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up);
  });
}

const CANVAS_PRESETS=[
  {label:'縦型（ショート）', ratio:'9:16', w:1080, h:1920},
  {label:'横型（YouTube）',  ratio:'16:9', w:1920, h:1080},

let _szPop=null;
function closeSzPop(){ if(_szPop){ _szPop.remove(); _szPop=null; document.removeEventListener('pointerdown',_szOut); } }
function _szOut(e){ if(_szPop && !_szPop.contains(e.target) && e.target!==$('pvSize')) closeSzPop(); }
function scalePxValues(k){
  const sc=v=>(typeof v==='number' && v>0)?Math.round(v*k):v;
  const st=proj.style||{};
  if(st.fontsize) st.fontsize=sc(st.fontsize);
  if(st.marginBottom) st.marginBottom=sc(st.marginBottom);
  if(st.box){ if(st.box.pad) st.box.pad=sc(st.box.pad); if(st.box.radius) st.box.radius=sc(st.box.radius); }
  proj.tracks.forEach(t=>t.clips.forEach(c=>{
    if(c.fontsize) c.fontsize=sc(c.fontsize);
    if(c.outlineWidth) c.outlineWidth=sc(c.outlineWidth);
  }));
}
function applyCanvasSize(w,h,scaleText){
  w=Math.max(16,Math.round(w)/2*2|0); h=Math.max(16,Math.round(h)/2*2|0);   // ffmpeg向けに偶数化
  w=w%2?w+1:w; h=h%2?h+1:h;
  const ow=proj.canvas.w||w;
  if(w===proj.canvas.w && h===proj.canvas.h){ closeSzPop(); return; }
  if(scaleText && ow && w!==ow) scalePxValues(w/ow);
  proj.canvas.w=w; proj.canvas.h=h;
  capPngCache={};                    // 字幕PNGはキャンバス寸法込みで描くので作り直す
  closeSzPop(); pushHistory(); build();
  setStatus('📐 書き出しサイズを '+w+'×'+h+' に変更'+(scaleText&&w!==ow?'（文字サイズも合わせました）':''));
}
function openSizePop(){

    d.innerHTML='<b>'+p.label+'</b><span>'+p.w+'×'+p.h+'</span>';

  const row=document.createElement('div'); row.className='szrow';

  go.addEventListener('click',apply);

  row.append(iw,document.createTextNode('×'),ih,document.createTextNode('px'));
  pop.append(lb,row,chk,go);

  const a=$('pvSize').getBoundingClientRect(), pw=pop.offsetWidth, ph=pop.offsetHeight;
